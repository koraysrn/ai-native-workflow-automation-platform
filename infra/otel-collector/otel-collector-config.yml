receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  prometheus:
    endpoint: "0.0.0.0:8889"
  debug:
    # `detailed` prints each span including its trace ID. The local/CI observability proof reads
    # that ID from the collector logs to prove the span arrived (issue #190).
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      # Prometheus is a metrics backend; traces must not be exported there.
      # Wire a real trace backend (Jaeger/Tempo/OTLP) in production.
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
