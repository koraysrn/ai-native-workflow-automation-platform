apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: awap-backend
  namespace: awap
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: awap-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: awap-frontend
  namespace: awap
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: awap-frontend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: awap-ai-layer
  namespace: awap
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: awap-ai-layer
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
