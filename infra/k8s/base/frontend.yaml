apiVersion: apps/v1
kind: Deployment
metadata:
  name: awap-frontend
  namespace: awap
spec:
  replicas: 2
  selector:
    matchLabels:
      app: awap-frontend
  template:
    metadata:
      labels:
        app: awap-frontend
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: awap-frontend
      containers:
        - name: frontend
          image: ghcr.io/awap/awap-frontend:latest
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          envFrom:
            - configMapRef:
                name: awap-feature-flags
          readinessProbe:
            httpGet:
              path: /
              port: 3000
          livenessProbe:
            httpGet:
              path: /
              port: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: awap-frontend
  namespace: awap
spec:
  selector:
    app: awap-frontend
  ports:
    - port: 3000
      targetPort: 3000
