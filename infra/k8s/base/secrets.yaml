# Sealed Secrets (bitnami-labs/sealed-secrets) resources.
#
# These SealedSecret objects are the ONLY secret manifests committed to the
# repository. The Sealed Secrets controller decrypts them into the target
# Secrets at deploy time. Plain-text Secret YAML must NEVER be committed.
#
# The placeholders below are replaced with deployable ciphertext by issue #188.
# Each overlay patches the target namespace.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: awap-backend-secrets
  namespace: awap
spec:
  template:
    metadata:
      name: awap-backend-secrets
      namespace: awap
    type: Opaque
  encryptedData:
    db-url: AgBy3i4jSWK+...
    db-user: AgBy3i4jSWK+...
    db-password: AgBy3i4jSWK+...
    jwt-secret: AgBy3i4jSWK+...
    minio-access-key: AgBy3i4jSWK+...
    minio-secret-key: AgBy3i4jSWK+...
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: awap-infra-secrets
  namespace: awap
spec:
  template:
    metadata:
      name: awap-infra-secrets
      namespace: awap
    type: Opaque
  encryptedData:
    minio-root-user: AgBy3i4jSWK+...
    minio-root-password: AgBy3i4jSWK+...
