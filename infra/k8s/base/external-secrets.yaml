# Secret delivery via External Secrets Operator + Vault (issue #188).
#
# Vault is the single source of truth. The External Secrets Operator (ESO)
# authenticates with the `awap-external-secrets` service account, reads the
# KV v2 paths below and materialises ordinary Kubernetes Secrets for the
# workloads. No plaintext or placeholder ciphertext is committed to Git.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: awap-external-secrets
  namespace: awap
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: awap-vault
  namespace: awap
spec:
  provider:
    vault:
      server: http://vault.vault.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: awap
          serviceAccountRef:
            name: awap-external-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: awap-backend-secrets
  namespace: awap
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: awap-vault
    kind: SecretStore
  target:
    name: awap-backend-secrets
    creationPolicy: Owner
  data:
    - secretKey: db-url
      remoteRef:
        key: awap/backend
        property: db-url
    - secretKey: db-user
      remoteRef:
        key: awap/backend
        property: db-user
    - secretKey: db-password
      remoteRef:
        key: awap/backend
        property: db-password
    - secretKey: jwt-secret
      remoteRef:
        key: awap/backend
        property: jwt-secret
    - secretKey: minio-access-key
      remoteRef:
        key: awap/backend
        property: minio-access-key
    - secretKey: minio-secret-key
      remoteRef:
        key: awap/backend
        property: minio-secret-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: awap-infra-secrets
  namespace: awap
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: awap-vault
    kind: SecretStore
  target:
    name: awap-infra-secrets
    creationPolicy: Owner
  data:
    - secretKey: minio-root-user
      remoteRef:
        key: awap/infra
        property: minio-root-user
    - secretKey: minio-root-password
      remoteRef:
        key: awap/infra
        property: minio-root-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: awap-dr-secrets
  namespace: awap
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: awap-vault
    kind: SecretStore
  target:
    name: awap-dr-secrets
    creationPolicy: Owner
  data:
    - secretKey: minio-endpoint
      remoteRef:
        key: awap/dr
        property: minio-endpoint
    - secretKey: minio-access-key
      remoteRef:
        key: awap/dr
        property: minio-access-key
    - secretKey: minio-secret-key
      remoteRef:
        key: awap/dr
        property: minio-secret-key
