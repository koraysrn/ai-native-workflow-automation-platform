apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: awap-staging
resources:
  - ../../base
  - namespace.yaml
images:
  - name: ghcr.io/awap/awap-backend
    newTag: staging
  - name: ghcr.io/awap/awap-frontend
    newTag: staging
  - name: ghcr.io/awap/awap-ai-layer
    newTag: staging
configMapGenerator:
  - name: awap-feature-flags
    literals:
      - ENVIRONMENT=staging
      - FEATURE_AI_STEPS=true
      - FEATURE_ANALYTICS=true
      - FEATURE_CDC=true
patches:
  - target:
      kind: Deployment
      name: awap-backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      name: awap-frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      name: awap-ai-layer
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: HorizontalPodAutoscaler
      name: awap-backend
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 6
  - target:
      kind: HorizontalPodAutoscaler
      name: awap-frontend
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 4
  - target:
      kind: HorizontalPodAutoscaler
      name: awap-ai-layer
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3
  - target:
      kind: Ingress
      name: awap-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: staging.awap.local
      - op: add
        path: /spec/tls
        value:
          - hosts: [staging.awap.local]
            secretName: awap-staging-tls
  - target:
      kind: SecretStore
      name: awap-vault
    patch: |-
      - op: replace
        path: /spec/provider/vault/auth/kubernetes/role
        value: awap-staging
  - target:
      kind: ExternalSecret
      name: awap-backend-secrets
    patch: |-
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: awap-staging/backend
      - op: replace
        path: /spec/data/1/remoteRef/key
        value: awap-staging/backend
      - op: replace
        path: /spec/data/2/remoteRef/key
        value: awap-staging/backend
      - op: replace
        path: /spec/data/3/remoteRef/key
        value: awap-staging/backend
      - op: replace
        path: /spec/data/4/remoteRef/key
        value: awap-staging/backend
      - op: replace
        path: /spec/data/5/remoteRef/key
        value: awap-staging/backend
  - target:
      kind: ExternalSecret
      name: awap-infra-secrets
    patch: |-
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: awap-staging/infra
      - op: replace
        path: /spec/data/1/remoteRef/key
        value: awap-staging/infra
  - target:
      kind: ExternalSecret
      name: awap-dr-secrets
    patch: |-
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: awap-staging/dr
      - op: replace
        path: /spec/data/1/remoteRef/key
        value: awap-staging/dr
      - op: replace
        path: /spec/data/2/remoteRef/key
        value: awap-staging/dr
