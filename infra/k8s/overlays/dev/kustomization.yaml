apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: awap-dev
resources:
  - ../../base
  - namespace.yaml
images:
  - name: ghcr.io/awap/awap-backend
    newTag: dev
  - name: ghcr.io/awap/awap-frontend
    newTag: dev
  - name: ghcr.io/awap/awap-ai-layer
    newTag: dev
configMapGenerator:
  - name: awap-feature-flags
    literals:
      - ENVIRONMENT=dev
      - FEATURE_AI_STEPS=false
      - FEATURE_ANALYTICS=true
      - FEATURE_CDC=false
patches:
  - target:
      kind: Deployment
      name: awap-backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: awap-frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: awap-ai-layer
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: HorizontalPodAutoscaler
      name: awap-backend
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3
  - target:
      kind: HorizontalPodAutoscaler
      name: awap-frontend
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3
  - target:
      kind: HorizontalPodAutoscaler
      name: awap-ai-layer
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
  - target:
      kind: Ingress
      name: awap-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: dev.awap.local
      - op: add
        path: /spec/tls
        value:
          - hosts: [dev.awap.local]
            secretName: awap-dev-tls
  - target:
      kind: SealedSecret
      name: awap-backend-secrets
    patch: |-
      - op: replace
        path: /spec/template/metadata/namespace
        value: awap-dev
  - target:
      kind: SealedSecret
      name: awap-infra-secrets
    patch: |-
      - op: replace
        path: /spec/template/metadata/namespace
        value: awap-dev
