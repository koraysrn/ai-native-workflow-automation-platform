# Debezium Kafka Connect for the outbox CDC cutover (issue #131).
# Apply after the backend/database stack is running; the connector itself is registered by
# infra/debezium/register-connector.sh (or the optional job at the bottom).
apiVersion: v1
kind: Secret
metadata:
  name: awap-connect-db
  namespace: awap
  labels:
    app.kubernetes.io/name: awap-connect
type: Opaque
stringData:
  # Placeholder only: production values are injected by SealedSecrets/Vault (see runbook O5).
  DB_USER: replace-me
  DB_PASSWORD: replace-me
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: awap-connect
  namespace: awap
  labels:
    app.kubernetes.io/name: awap-connect
    app.kubernetes.io/part-of: awap
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: awap-connect
  template:
    metadata:
      labels:
        app.kubernetes.io/name: awap-connect
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8083"
    spec:
      containers:
        - name: connect
          image: quay.io/debezium/connect:3.0
          ports:
            - name: rest
              containerPort: 8083
          env:
            # The Debezium image maps these unprefixed names onto CONNECT_* before starting the
            # worker; CONNECT_* entries are passed through as worker properties.
            - name: BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: GROUP_ID
              value: awap-connect
            - name: CONFIG_STORAGE_TOPIC
              value: awap.connect.configs
            - name: OFFSET_STORAGE_TOPIC
              value: awap.connect.offsets
            - name: STATUS_STORAGE_TOPIC
              value: awap.connect.status
            - name: CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR
              value: "3"
            - name: CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR
              value: "3"
            - name: CONNECT_STATUS_STORAGE_REPLICATION_FACTOR
              value: "3"
            - name: KEY_CONVERTER
              value: org.apache.kafka.connect.storage.StringConverter
            - name: VALUE_CONVERTER
              value: org.apache.kafka.connect.json.JsonConverter
            - name: CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE
              value: "false"
            - name: CONNECT_PLUGIN_PATH
              value: /kafka/connect
            - name: CONNECT_PRODUCER_OVERRIDE_ENABLE_IDEMPOTENCE
              value: "true"
            - name: CONNECT_PRODUCER_OVERRIDE_ACKS
              value: all
            - name: REST_HOST_NAME
              value: 0.0.0.0
            - name: ADVERTISED_HOST_NAME
              value: awap-connect
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: awap
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: awap-connect-db
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: awap-connect-db
                  key: DB_PASSWORD
          readinessProbe:
            httpGet:
              path: /connectors
              port: rest
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: rest
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: awap-connect
  namespace: awap
  labels:
    app.kubernetes.io/name: awap-connect
spec:
  selector:
    app.kubernetes.io/name: awap-connect
  ports:
    - name: rest
      port: 8083
      targetPort: rest
