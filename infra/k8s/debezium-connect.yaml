# Debezium Kafka Connect for the outbox CDC cutover (issue #131).
# Apply after the backend/database stack is running; the connector itself is registered by
# infra/debezium/register-connector.sh (or the optional job at the bottom).
apiVersion: v1
kind: Secret
metadata:
  name: awap-connect-db
  namespace: awap
  labels:
    app.kubernetes.io/name: awap-connect
type: Opaque
stringData:
  # Placeholder only: production values are injected by SealedSecrets/Vault (see runbook O5).
  DB_USER: replace-me
  DB_PASSWORD: replace-me
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: awap-connect
  namespace: awap
  labels:
    app.kubernetes.io/name: awap-connect
    app.kubernetes.io/part-of: awap
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: awap-connect
  template:
    metadata:
      labels:
        app.kubernetes.io/name: awap-connect
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8083"
    spec:
      containers:
        - name: connect
          image: quay.io/debezium/connect:3.0
          ports:
            - name: rest
              containerPort: 8083
          env:
            # The Debezium image maps these unprefixed names onto CONNECT_* before starting the
            # worker; CONNECT_* entries are passed through as worker properties.
            - name: BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: GROUP_ID
              value: awap-connect
            - name: CONFIG_STORAGE_TOPIC
              value: awap.connect.configs
            - name: OFFSET_STORAGE_TOPIC
              value: awap.connect.offsets
            - name: STATUS_STORAGE_TOPIC
              value: awap.connect.status
            - name: CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR
              value: "3"
            - name: CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR
              value: "3"
            - name: CONNECT_STATUS_STORAGE_REPLICATION_FACTOR
              value: "3"
            - name: KEY_CONVERTER
              value: org.apache.kafka.connect.storage.StringConverter
            - name: VALUE_CONVERTER
              value: org.apache.kafka.connect.json.JsonConverter
            - name: CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE
              value: "false"
            - name: CONNECT_PLUGIN_PATH
              value: /kafka/connect
            - name: CONNECT_PRODUCER_OVERRIDE_ENABLE_IDEMPOTENCE
              value: "true"
            - name: CONNECT_PRODUCER_OVERRIDE_ACKS
              value: all
            - name: REST_HOST_NAME
              value: 0.0.0.0
            - name: ADVERTISED_HOST_NAME
              value: awap-connect
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: awap
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: awap-connect-db
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: awap-connect-db
                  key: DB_PASSWORD
          readinessProbe:
            httpGet:
              path: /connectors
              port: rest
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: rest
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: awap-connect
  namespace: awap
  labels:
    app.kubernetes.io/name: awap-connect
spec:
  selector:
    app.kubernetes.io/name: awap-connect
  ports:
    - name: rest
      port: 8083
      targetPort: rest
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: awap-connect-connector
  namespace: awap
  labels:
    app.kubernetes.io/name: awap-connect
data:
  # Kept byte-for-byte in sync with infra/debezium/outbox-connector.json; the connector test
  # parses both JSON documents and compares them so the two deployment paths cannot drift.
  outbox-connector.json: |
    {
      "name": "awap-outbox-connector",
      "config": {
        "connector.class": "io.debezium.connector.postgresql.PostgresConnector",
        "tasks.max": "1",
        "database.hostname": "${DB_HOST}",
        "database.port": "${DB_PORT}",
        "database.user": "${DB_USER}",
        "database.password": "${DB_PASSWORD}",
        "database.dbname": "${DB_NAME}",
        "topic.prefix": "awap",
        "schema.include.list": "public",
        "table.include.list": "public.outbox_events,public.outbox_events.*",
        "plugin.name": "pgoutput",
        "slot.name": "awap_outbox",
        "publication.name": "awap_outbox_pub",
        "publication.autocreate.mode": "filtered",
        "snapshot.mode": "no_data",
        "tombstones.on.delete": "false",
        "heartbeat.interval.ms": "10000",
        "max.batch.size": "2048",
        "poll.interval.ms": "250",
        "key.converter": "org.apache.kafka.connect.storage.StringConverter",
        "value.converter": "org.apache.kafka.connect.json.JsonConverter",
        "value.converter.schemas.enable": "false",
        "errors.tolerance": "all",
        "errors.deadletterqueue.topic.name": "awap.cdc.dead-letter",
        "errors.deadletterqueue.context.headers.enable": "true",
        "errors.log.enable": "true",
        "errors.log.include.messages": "true",
        "transforms": "outbox,extractTenant",
        "transforms.outbox.type": "io.debezium.transforms.outbox.EventRouter",
        "transforms.outbox.table.field.event.id": "id",
        "transforms.outbox.table.field.event.key": "aggregate_id",
        "transforms.outbox.table.field.event.type": "event_type",
        "transforms.outbox.table.field.event.payload": "payload_json",
        "transforms.outbox.route.by.field": "aggregate_type",
        "transforms.outbox.route.topic.replacement": "outbox.event.${routedByValue}",
        "transforms.outbox.table.fields.additional.placement": "tenant_id:header:tenantId",
        "transforms.extractTenant.type": "org.apache.kafka.connect.transforms.InsertHeader",
        "transforms.extractTenant.header": "x-awap-source",
        "transforms.extractTenant.value.literal": "debezium-cdc"
      }
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: awap-connect-register
  namespace: awap
  labels:
    app.kubernetes.io/name: awap-connect
    app.kubernetes.io/component: registration
spec:
  # A completed Job is immutable. Delete it before re-applying when the connector ConfigMap
  # changes; the runbook shows the exact command.
  backoffLimit: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: awap-connect
        app.kubernetes.io/component: registration
    spec:
      restartPolicy: OnFailure
      containers:
        - name: register
          image: alpine:3.20
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              apk add --no-cache curl jq gettext >/dev/null
              echo "Waiting for the Connect REST API..."
              for attempt in $(seq 1 60); do
                if curl -fsS "${CONNECT_URL}/connectors" >/dev/null 2>&1; then
                  break
                fi
                if [ "${attempt}" -eq 60 ]; then
                  echo "Connect REST API did not become ready" >&2
                  exit 1
                fi
                sleep 5
              done
              payload="$(envsubst '${DB_HOST} ${DB_PORT} ${DB_USER} ${DB_PASSWORD} ${DB_NAME}' < /config/outbox-connector.json)"
              if curl -fsS "${CONNECT_URL}/connectors/${CONNECTOR_NAME}" >/dev/null 2>&1; then
                echo "Updating connector ${CONNECTOR_NAME}"
                config_payload="$(printf '%s' "${payload}" | jq -c '.config')"
                curl -fsS -X PUT -H "Content-Type: application/json" \
                  --data "${config_payload}" "${CONNECT_URL}/connectors/${CONNECTOR_NAME}/config"
              else
                echo "Creating connector ${CONNECTOR_NAME}"
                curl -fsS -X POST -H "Content-Type: application/json" \
                  --data "${payload}" "${CONNECT_URL}/connectors"
              fi
              echo
              echo "Connector status:"
              for attempt in $(seq 1 30); do
                if status="$(curl -fsS "${CONNECT_URL}/connectors/${CONNECTOR_NAME}/status")"; then
                  printf '%s\n' "${status}"
                  ready="$(printf '%s' "${status}" | jq -r '(.connector.state == "RUNNING") and ((.tasks | length) > 0) and all(.tasks[]; .state == "RUNNING")')"
                  if [ "${ready}" = "true" ]; then
                    exit 0
                  fi
                fi
                sleep 2
              done
              echo "Connector did not become RUNNING within 60s" >&2
              exit 1
          env:
            - name: CONNECT_URL
              value: http://awap-connect:8083
            - name: CONNECTOR_NAME
              value: awap-outbox-connector
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: awap
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: awap-connect-db
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: awap-connect-db
                  key: DB_PASSWORD
          volumeMounts:
            - name: connector-config
              mountPath: /config
              readOnly: true
      volumes:
        - name: connector-config
          configMap:
            name: awap-connect-connector
