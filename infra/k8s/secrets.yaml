# Sealed Secrets (bitnami-labs/sealed-secrets) resources.
#
# These SealedSecret objects are the ONLY secret manifests committed to the
# repository. The Sealed Secrets controller decrypts them into the target
# Secrets at deploy time. Plain-text Secret YAML must NEVER be committed.
#
# How to (re)seal a value:
#   1. Install kubeseal (https://github.com/bitnami-labs/sealed-secrets).
#   2. Fetch the cluster controller certificate:
#        kubeseal --fetch-cert > pub-cert.pem
#   3. Seal each value from the plain-text template:
#        echo -n 'secret-value' | kubeseal --cert pub-cert.pem --scope namespace-wide \
#          --namespace awap --name awap-backend-secrets --raw
#   4. Paste the returned encrypted string into spec.encryptedData below.
#
# The plain-text values live only in Vault (or the developer's local, gitignored
# secrets file) and are never written to disk in this repository.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: awap-backend-secrets
  namespace: awap
spec:
  template:
    metadata:
      name: awap-backend-secrets
      namespace: awap
    type: Opaque
  encryptedData:
    db-url: AgBy3i4jSWK+... # sealed value produced by kubeseal
    db-user: AgBy3i4jSWK+...
    db-password: AgBy3i4jSWK+...
    jwt-secret: AgBy3i4jSWK+...
    minio-access-key: AgBy3i4jSWK+...
    minio-secret-key: AgBy3i4jSWK+...
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: awap-infra-secrets
  namespace: awap-infra
spec:
  template:
    metadata:
      name: awap-infra-secrets
      namespace: awap-infra
    type: Opaque
  encryptedData:
    minio-root-user: AgBy3i4jSWK+...
    minio-root-password: AgBy3i4jSWK+...
