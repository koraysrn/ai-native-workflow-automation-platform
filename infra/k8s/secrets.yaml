# Placeholder Secret definitions. Real values are provisioned from Vault / Sealed
# Secrets in the GitOps pipeline and must never be committed in plain text.
# The CHANGE_ME placeholders keep the manifests deployable for local development only.
apiVersion: v1
kind: Secret
metadata:
  name: awap-backend-secrets
  namespace: awap
type: Opaque
stringData:
  db-url: jdbc:postgresql://postgres.awap-infra:5432/awap
  db-user: awap_app
  db-password: CHANGE_ME
  jwt-secret: CHANGE_ME
  minio-access-key: CHANGE_ME
  minio-secret-key: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: awap-infra-secrets
  namespace: awap-infra
type: Opaque
stringData:
  minio-root-user: CHANGE_ME
  minio-root-password: CHANGE_ME
