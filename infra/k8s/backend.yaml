apiVersion: apps/v1
kind: Deployment
metadata:
  name: awap-backend
  namespace: awap
spec:
  replicas: 2
  selector:
    matchLabels:
      app: awap-backend
  template:
    metadata:
      labels:
        app: awap-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/awap/awap-backend:latest
          ports:
            - containerPort: 8080
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: awap-backend-secrets
                  key: db-url
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: awap-backend-secrets
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: awap-backend-secrets
                  key: db-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: awap-backend-secrets
                  key: jwt-secret
            - name: MINIO_ENDPOINT
              value: http://minio.awap-infra:9000
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: awap-backend-secrets
                  key: minio-access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: awap-backend-secrets
                  key: minio-secret-key
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: OTLP_ENDPOINT
              value: http://otel-collector:4318/v1/traces
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: awap-backend
  namespace: awap
spec:
  selector:
    app: awap-backend
  ports:
    - port: 8080
      targetPort: 8080
