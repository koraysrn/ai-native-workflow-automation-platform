apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: awap
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/koraysrn/ai-native-workflow-automation-platform.git
    path: infra/k8s
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: awap
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
