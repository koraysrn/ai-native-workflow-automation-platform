# Debezium Kafka Connect for the outbox CDC cutover (issue #131).
#
# Run alongside the main stack:
#   docker compose -f infra/docker-compose.yml up -d
#   docker compose -f infra/docker-compose.cdc.yml up -d
#   ./infra/debezium/register-connector.sh
#
# The connector is idle until an operator registers it, so starting this file does not
# change production behaviour; the polling relay keeps running during the dual-run window.
services:
  connect:
    image: quay.io/debezium/connect:${DEBEZIUM_VERSION:-3.0}
    # Kafka is defined in infra/docker-compose.yml; Compose rejects a depends_on reference to a
    # service from another file. The runbook starts the main stack first, and Connect retries its
    # bootstrap connection until the broker is reachable.
    ports:
      - "8083:8083"
    environment:
      # The Debezium image maps these unprefixed names onto CONNECT_* before starting the worker.
      # Use the INTERNAL listener: the PLAINTEXT listener advertises localhost:9092, which is not
      # reachable from inside the Connect container.
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: awap-connect
      CONFIG_STORAGE_TOPIC: awap.connect.configs
      OFFSET_STORAGE_TOPIC: awap.connect.offsets
      STATUS_STORAGE_TOPIC: awap.connect.status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "1"
      KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      # The image ships the connectors in /kafka/connect; /usr/share/java is empty.
      CONNECT_PLUGIN_PATH: /kafka/connect
      CONNECT_PRODUCER_OVERRIDE_ENABLE_IDEMPOTENCE: "true"
      CONNECT_PRODUCER_OVERRIDE_ACKS: all
      REST_HOST_NAME: 0.0.0.0
      ADVERTISED_HOST_NAME: connect
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-awap}
      DB_PASSWORD: ${DB_PASSWORD:-awap}
      DB_NAME: ${DB_NAME:-awap}
    volumes:
      - ./debezium/outbox-connector.json:/kafka/connectors/outbox-connector.json:ro
    networks:
      - awap
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/connectors || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

networks:
  awap:
    external: true
    name: ${AWAP_NETWORK:-infra_default}
