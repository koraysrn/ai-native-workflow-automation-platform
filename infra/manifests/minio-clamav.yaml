apiVersion: v1
kind: Namespace
metadata:
  name: awap-infra
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: awap-infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              value: awapadmin
            - name: MINIO_ROOT_PASSWORD
              value: awapadmin123
          ports:
            - containerPort: 9000
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: awap-infra
spec:
  type: NodePort
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
      nodePort: 30000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clamav
  namespace: awap-infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clamav
  template:
    metadata:
      labels:
        app: clamav
    spec:
      containers:
        - name: clamav
          image: clamav/clamav:latest
          ports:
            - containerPort: 3310
---
apiVersion: v1
kind: Service
metadata:
  name: clamav
  namespace: awap-infra
spec:
  selector:
    app: clamav
  ports:
    - port: 3310
      targetPort: 3310
