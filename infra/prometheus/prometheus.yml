global:
  scrape_interval: 15s

rule_files:
  - alert-rules.yml
  # CDC rules are loaded only when the Debezium connector is deployed (issue #131); the file is
  # valid even without the slot, the series simply stay absent.
  - cdc-alert-rules.yml

scrape_configs:
  - job_name: awap-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
