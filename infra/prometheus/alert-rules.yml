groups:
  - name: awap-workflow
    rules:
      # Failure ratio = failures / (successes + failures); the clamp keeps an idle
      # tenant from producing a division by zero. 20% over 10m ignores a single spike.
      - alert: AwapWorkflowFailureRateHigh
        expr: |
          sum(rate(awap_workflow_failure_total[10m]))
            / clamp_min(
                sum(rate(awap_workflow_success_total[10m]))
                  + sum(rate(awap_workflow_failure_total[10m])),
                0.001
              ) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Workflow failure ratio above 20%"
          description: "{{ $value | humanizePercentage }} of workflow executions failed over 10 minutes."
          runbook_url: "https://github.com/koraysrn/ai-native-workflow-automation-platform/blob/main/docs/operations-runbook.md#o3--slo-alerts"

      - alert: AwapNotificationRetryLagHigh
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(awap_notification_retry_lag_seconds_bucket[10m]))) > 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Notification retry lag p95 above 10s"
          description: "Deliveries that needed a retry are taking {{ $value }}s at p95."
          runbook_url: "https://github.com/koraysrn/ai-native-workflow-automation-platform/blob/main/docs/operations-runbook.md#o11--notification-retries-issue-119"

      - alert: AwapWebhookDeadGrowth
        expr: increase(awap_dlq_messages_total[15m]) > 10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Webhook/DLQ dead messages are growing"
          description: "{{ $value }} messages landed in the DLQ within 15 minutes; webhook retries are exhausting."
          runbook_url: "https://github.com/koraysrn/ai-native-workflow-automation-platform/blob/main/docs/operations-runbook.md#o3--slo-alerts"

      - alert: AwapOutboxBacklogStuck
        expr: awap_outbox_pending > 1000
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Outbox backlog is stuck"
          description: "{{ $value }} outbox rows are unpublished after 15 minutes; the relay is not draining."
          runbook_url: "https://github.com/koraysrn/ai-native-workflow-automation-platform/blob/main/docs/operations-runbook.md#o3--slo-alerts"

  - name: awap
    rules:
      # A small trickle of DLQ messages is tolerable (transient poison messages are
      # retried before landing here); alert only once a meaningful backlog forms.
      # awap_dlq_messages_total is tagged by topic, so the sum keeps one alert for all series.
      - alert: AwapDlqMessages
        expr: sum(increase(awap_dlq_messages_total[5m])) > 5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Dead-letter messages detected"
          description: "{{ $value }} dead-letter messages were consumed in the last 5 minutes."
          runbook_url: "https://github.com/koraysrn/ai-native-workflow-automation-platform/blob/main/docs/operations-runbook.md#o3--slo-alerts"

      - alert: AwapDlqMessagesCritical
        expr: sum(increase(awap_dlq_messages_total[5m])) > 50
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Dead-letter backlog is growing fast"
          description: "{{ $value }} dead-letter messages in 5 minutes; investigate the consumer pipeline immediately."
          runbook_url: "https://github.com/koraysrn/ai-native-workflow-automation-platform/blob/main/docs/operations-runbook.md#o3--slo-alerts"

      # Node timeouts: a sustained rate means either a too-tight budget or a slow dependency.
      # See docs/node-timeouts.md before tuning awap.engine.node-timeout.*.
      - alert: AwapNodeTimeouts
        expr: sum(increase(awap_node_timeout_total[10m])) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Workflow node timeouts are elevated"
          description: "{{ $value }} node timeouts in 10 minutes; check awap.node.duration{type=...} and the node timeout budgets."
          runbook_url: "https://github.com/koraysrn/ai-native-workflow-automation-platform/blob/main/docs/operations-runbook.md#o31--node-timeouts"

      - alert: AwapNodeTimeoutFailures
        expr: sum(increase(awap_node_timeout_failures_total[10m])) > 3
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Workflow nodes are failing terminally on timeouts"
          description: "{{ $value }} node executions exhausted their retry budget after a timeout."
          runbook_url: "https://github.com/koraysrn/ai-native-workflow-automation-platform/blob/main/docs/operations-runbook.md#o31--node-timeouts"

      # A worker that swallows the interrupt keeps a thread alive past its budget; this is the
      # thread-leak alert for the node timeout executor.
      - alert: AwapNodeTimeoutAbandonedWorkers
        expr: max(awap_node_timeout_abandoned) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Node timeout workers are leaking"
          description: "{{ $value }} timeout worker(s) ignored the interrupt for more than 5 minutes."
          runbook_url: "https://github.com/koraysrn/ai-native-workflow-automation-platform/blob/main/docs/operations-runbook.md#o31--node-timeouts"

      - alert: AwapNodeTimeoutExecutorRejections
        expr: sum(increase(awap_node_timeout_rejected_total[5m])) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Node timeout executor is saturated"
          description: "{{ $value }} node executions were rejected by the bounded timeout executor."
          runbook_url: "https://github.com/koraysrn/ai-native-workflow-automation-platform/blob/main/docs/operations-runbook.md#o31--node-timeouts"

  - name: awap-replay
    rules:
      # A single divergence means the execution log no longer explains the persisted state.
      # Replay must never be "fixed" by silently republishing; see docs/operations-runbook.md (O9).
      - alert: AwapReplayDivergence
        expr: increase(awap_replay_divergences_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Deterministic replay divergence detected"
          description: "{{ $value }} replay divergence(s) in the last 5 minutes; open the replay_runs audit row and follow runbook O9."
          runbook_url: "https://github.com/koraysrn/ai-native-workflow-automation-platform/blob/main/docs/operations-runbook.md#o9--deterministic-replay-issue-116"

      # Controlled rejections (row cap, timeout, concurrent replay) are a capacity signal.
      - alert: AwapReplayRejected
        expr: increase(awap_replay_limits_total{reason="timeout"}[15m]) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Replay timeouts are frequent"
          description: "{{ $value }} replay timeouts in 15 minutes; check awap.replay.timeout and log growth."
          runbook_url: "https://github.com/koraysrn/ai-native-workflow-automation-platform/blob/main/docs/operations-runbook.md#o9--deterministic-replay-issue-116"

  - name: awap-file-pipeline
    rules:
      - alert: AwapFileInfected
        expr: increase(awap_file_infected_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Malware found in a quarantined upload"
          description: "ClamAV marked {{ $value }} upload(s) as INFECTED in the last 5 minutes; the object was never promoted."
          runbook_url: "https://github.com/koraysrn/ai-native-workflow-automation-platform/blob/main/docs/operations-runbook.md#o10--quarantine-uploads-promotion-and-infected-files-118"

      - alert: AwapFilePromoteFailures
        expr: increase(awap_file_promote_fail_total[5m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Quarantine promotion is failing"
          description: "{{ $value }} promotion failure(s) in 5 minutes; the source object is retained for a safe retry."
          runbook_url: "https://github.com/koraysrn/ai-native-workflow-automation-platform/blob/main/docs/operations-runbook.md#o10--quarantine-uploads-promotion-and-infected-files-118"

      - alert: AwapFileScanFailures
        expr: increase(awap_file_scan_duration_seconds_count{result="failed"}[10m]) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Antivirus scan failures are accumulating"
          description: "More than 3 scans failed in 10 minutes; files remain SCAN_FAILED and are retried."
          runbook_url: "https://github.com/koraysrn/ai-native-workflow-automation-platform/blob/main/docs/operations-runbook.md#o10--quarantine-uploads-promotion-and-infected-files-118"

  - name: awap-notification-retry
    rules:
      # The retry-lag alert itself lives in the notification group above (single definition).
      - alert: AwapNotificationRetryDeadLettered
        expr: increase(awap_notification_retry_dlq_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Notification deliveries were dead-lettered"
          description: "{{ $value }} delivery(ies) exhausted retries or failed permanently in the last 5 minutes; inspect notification.send.dlq."
          runbook_url: "https://github.com/koraysrn/ai-native-workflow-automation-platform/blob/main/docs/operations-runbook.md#o11--notification-retries-issue-119"

      - alert: AwapNotificationLeaseConflicts
        expr: increase(awap_notification_retry_lease_conflicts_total[10m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High notification retry lease contention"
          description: "{{ $value }} lease conflicts in 10 minutes; check replica count and lease duration settings."
          runbook_url: "https://github.com/koraysrn/ai-native-workflow-automation-platform/blob/main/docs/operations-runbook.md#o11--notification-retries-issue-119"

      - alert: AwapNotificationTemplateRenderFailures
        expr: increase(awap_notification_template_render_failures_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Notification template rendering is failing"
          description: "{{ $value }} render failure(s) in the last 5 minutes; a tenant template has a malformed or unknown placeholder."
          runbook_url: "https://github.com/koraysrn/ai-native-workflow-automation-platform/blob/main/docs/operations-runbook.md#notification-templates-cache-and-rendering-metrics"

  - name: awap-outbox
    rules:
      # A stale claim means a relay died between claiming and publishing (#121). Reconciliation
      # re-queues the row, so a single occurrence is a warning; sustained growth is an outage signal.
      - alert: AwapOutboxStaleClaims
        expr: increase(awap_outbox_stuck_total{reason="stale_claim"}[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Outbox claims are being left behind"
          description: "{{ $value }} outbox claims were released by reconciliation in 15 minutes; a relay is crashing inside the claim/publish window."
          runbook_url: "https://github.com/koraysrn/ai-native-workflow-automation-platform/blob/main/docs/operations-runbook.md#o13--outbox-claim-reconciliation-121"

      # Rows stranded by the pre-V44 relay: they are never republished automatically, an operator
      # must verify the Kafka record first (runbook O13).
      - alert: AwapOutboxLegacyRows
        expr: increase(awap_outbox_stuck_total{reason="legacy_published_without_timestamp"}[15m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Outbox rows marked published without published_at"
          description: "{{ $value }} legacy outbox rows need manual verification; follow runbook O13."
          runbook_url: "https://github.com/koraysrn/ai-native-workflow-automation-platform/blob/main/docs/operations-runbook.md#o13--outbox-claim-reconciliation-121"

      - alert: AwapOutboxPublishFailures
        expr: increase(awap_outbox_publish_failures_total[10m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Outbox publishes are failing"
          description: "{{ $value }} outbox publish failures in 10 minutes ({{ $labels.reason }})."
          runbook_url: "https://github.com/koraysrn/ai-native-workflow-automation-platform/blob/main/docs/operations-runbook.md#o13--outbox-claim-reconciliation-121"

      - alert: AwapOutboxClaimAgeHigh
        expr: awap_outbox_claim_age_seconds_max > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Outbox claims are staying stale for too long"
          description: "The oldest released outbox claim was {{ $value }}s old; reconciliation is not keeping up with crashed relays."
          runbook_url: "https://github.com/koraysrn/ai-native-workflow-automation-platform/blob/main/docs/operations-runbook.md#o13--outbox-claim-reconciliation-121"

      - alert: AwapOutboxQuarantinedRows
        expr: awap_outbox_exhausted > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Outbox rows are quarantined"
          description: "{{ $value }} outbox rows exhausted their publish attempts and need operator action."
          runbook_url: "https://github.com/koraysrn/ai-native-workflow-automation-platform/blob/main/docs/operations-runbook.md#o13--outbox-claim-reconciliation-121"

      # Issue #123: older deployments may still publish to the legacy topic. Any traffic there
      # means the dual-consume window is still needed; drain it with scripts/dlq-legacy-copy.sh.
      - alert: AwapLegacyDlqMessages
        expr: increase(awap_dlq_legacy_messages_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Legacy awap.dlq topic is still receiving dead letters"
          description: "{{ $value }} legacy dead-letter messages in 5 minutes. Run scripts/dlq-legacy-copy.sh and check which deployment still publishes to awap.dlq."
          runbook_url: "https://github.com/koraysrn/ai-native-workflow-automation-platform/blob/main/docs/operations-runbook.md#o15--legacy-awapdlq-dual-consume-and-removal-123"

      - alert: AwapDlqQuarantine
        expr: sum(increase(awap_dlq_quarantined_total[5m])) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Malformed dead-letter message quarantined"
          description: "{{ $value }} malformed dead-letter messages were quarantined in the last 5 minutes; inspect the quarantine file before deleting it."
          runbook_url: "https://github.com/koraysrn/ai-native-workflow-automation-platform/blob/main/docs/operations-runbook.md#o15--legacy-awapdlq-dual-consume-and-removal-123"

  - name: awap-slo
    rules:
      - alert: AwapHighErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            / clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 1) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Error rate above 5%"
          description: "{{ $value | humanizePercentage }} of requests are failing (5xx)."
          runbook_url: "https://github.com/koraysrn/ai-native-workflow-automation-platform/blob/main/docs/operations-runbook.md#o3--slo-alerts"

      - alert: AwapHighLatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_server_requests_seconds_bucket[5m])) by (le)) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p95 latency above 2s"
          description: "p95 request latency is {{ $value }}s over the last 5 minutes."
          runbook_url: "https://github.com/koraysrn/ai-native-workflow-automation-platform/blob/main/docs/operations-runbook.md#o3--slo-alerts"

      - alert: AwapInstanceDown
        expr: up{job="awap-identity"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "AWAP identity instance is down"
          description: "The awap-identity scrape target has been unreachable for 1 minute."
          runbook_url: "https://github.com/koraysrn/ai-native-workflow-automation-platform/blob/main/docs/operations-runbook.md#o3--slo-alerts"

  - name: awap-analytics-sink
    rules:
      - alert: AwapAnalyticsSinkDroppingEvents
        expr: increase(awap_analytics_sink_dropped_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Analytics events are being dropped"
          description: "{{ $value }} analytics events were dropped by the OpenSearch sink (queue overflow or open circuit) in 5 minutes."
          runbook_url: "https://github.com/koraysrn/ai-native-workflow-automation-platform/blob/main/docs/operations-runbook.md#o16--analytics-opensearch-sink-124"

      - alert: AwapAnalyticsSinkDeadLetters
        expr: increase(awap_analytics_sink_dead_letter_total[10m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Analytics dead-letter events detected"
          description: "{{ $value }} analytics events were routed to the dead-letter index; inspect mapping conflicts and malformed payloads."
          runbook_url: "https://github.com/koraysrn/ai-native-workflow-automation-platform/blob/main/docs/operations-runbook.md#o16--analytics-opensearch-sink-124"

      - alert: AwapAnalyticsSinkQueueDepthHigh
        expr: awap_analytics_sink_queue_depth > 500
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Analytics sink queue is filling up"
          description: "The analytics sink queue depth is {{ $value }}; OpenSearch may be unable to keep up."
          runbook_url: "https://github.com/koraysrn/ai-native-workflow-automation-platform/blob/main/docs/operations-runbook.md#o16--analytics-opensearch-sink-124"

      - alert: AwapAnalyticsSinkCircuitOpen
        expr: awap_analytics_sink_circuit_open == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Analytics sink circuit breaker is open"
          description: "The OpenSearch analytics sink has been failing; raw events are being shed while PostgreSQL aggregates remain authoritative."
          runbook_url: "https://github.com/koraysrn/ai-native-workflow-automation-platform/blob/main/docs/operations-runbook.md#o16--analytics-opensearch-sink-124"


  - name: awap-usage
    rules:
      - alert: AwapUsageQuotaExceeded
        expr: increase(awap_usage_quota_exceeded_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Tenant usage quota exceeded"
          description: "{{ $value }} requests were rejected with 429 because the tenant daily quota for {{ $labels.metric }} was reached."
          runbook_url: "https://github.com/koraysrn/ai-native-workflow-automation-platform/blob/main/docs/operations-runbook.md#o17--tenant-usage-metering-and-quotas-125"

      - alert: AwapUsageQuotaNearLimit
        expr: increase(awap_usage_quota_near_limit_total[1h]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Tenant usage is approaching its daily quota"
          description: "{{ $labels.metric }} usage crossed 80% of the tenant daily limit; quota rejections are likely if traffic continues."
          runbook_url: "https://github.com/koraysrn/ai-native-workflow-automation-platform/blob/main/docs/operations-runbook.md#o17--tenant-usage-metering-and-quotas-125"

      - alert: AwapUsageMeteringFailures
        expr: increase(awap_usage_metering_failures_total[5m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Usage metering is failing"
          description: "Metering writes for {{ $labels.metric }} failed; observational meters are fail-open while quota-enforcing calls are fail-closed (503)."
          runbook_url: "https://github.com/koraysrn/ai-native-workflow-automation-platform/blob/main/docs/operations-runbook.md#o17--tenant-usage-metering-and-quotas-125"

      - alert: AwapUsageReconciliationDrift
        expr: increase(awap_usage_reconciliation_drift_total[1h]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Usage counters drifted from the raw event ledger"
          description: "{{ $value }} counter rows for {{ $labels.metric }} were repaired by reconciliation; investigate the write path that lost increments."
          runbook_url: "https://github.com/koraysrn/ai-native-workflow-automation-platform/blob/main/docs/operations-runbook.md#o17--tenant-usage-metering-and-quotas-125"

      - alert: AwapUsageReconciliationStale
        expr: absent_over_time(awap_usage_reconciliation_runs_total[25h])
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Nightly usage reconciliation did not run"
          description: "No reconciliation run was observed in the last 25 hours; check USAGE_RECONCILIATION_CRON and the application logs."
          runbook_url: "https://github.com/koraysrn/ai-native-workflow-automation-platform/blob/main/docs/operations-runbook.md#o17--tenant-usage-metering-and-quotas-125"
