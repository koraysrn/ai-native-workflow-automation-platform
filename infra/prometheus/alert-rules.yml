groups:
  - name: awap
    rules:
      # A small trickle of DLQ messages is tolerable (transient poison messages are
      # retried before landing here); alert only once a meaningful backlog forms.
      - alert: AwapDlqMessages
        expr: increase(awap_dlq_messages_total[5m]) > 5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Dead-letter messages detected"
          description: "{{ $value }} dead-letter messages were consumed in the last 5 minutes."

      - alert: AwapDlqMessagesCritical
        expr: increase(awap_dlq_messages_total[5m]) > 50
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Dead-letter backlog is growing fast"
          description: "{{ $value }} dead-letter messages in 5 minutes; investigate the consumer pipeline immediately."

      # Node timeouts: a sustained rate means either a too-tight budget or a slow dependency.
      # See docs/node-timeouts.md before tuning awap.engine.node-timeout.*.
      - alert: AwapNodeTimeouts
        expr: sum(increase(awap_node_timeout_total[10m])) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Workflow node timeouts are elevated"
          description: "{{ $value }} node timeouts in 10 minutes; check awap.node.duration{type=...} and the node timeout budgets."

      - alert: AwapNodeTimeoutFailures
        expr: sum(increase(awap_node_timeout_failures_total[10m])) > 3
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Workflow nodes are failing terminally on timeouts"
          description: "{{ $value }} node executions exhausted their retry budget after a timeout."

      # A worker that swallows the interrupt keeps a thread alive past its budget; this is the
      # thread-leak alert for the node timeout executor.
      - alert: AwapNodeTimeoutAbandonedWorkers
        expr: max(awap_node_timeout_abandoned) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Node timeout workers are leaking"
          description: "{{ $value }} timeout worker(s) ignored the interrupt for more than 5 minutes."

      - alert: AwapNodeTimeoutExecutorRejections
        expr: sum(increase(awap_node_timeout_rejected_total[5m])) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Node timeout executor is saturated"
          description: "{{ $value }} node executions were rejected by the bounded timeout executor."

  - name: awap-slo
    rules:
      - alert: AwapHighErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            / clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 1) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Error rate above 5%"
          description: "{{ $value | humanizePercentage }} of requests are failing (5xx)."

      - alert: AwapHighLatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_server_requests_seconds_bucket[5m])) by (le)) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p95 latency above 2s"
          description: "p95 request latency is {{ $value }}s over the last 5 minutes."

      - alert: AwapInstanceDown
        expr: up{job="awap-identity"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "AWAP identity instance is down"
          description: "The awap-identity scrape target has been unreachable for 1 minute."
