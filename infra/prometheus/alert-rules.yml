groups:
  - name: awap
    rules:
      # A small trickle of DLQ messages is tolerable (transient poison messages are
      # retried before landing here); alert only once a meaningful backlog forms.
      # awap_dlq_messages_total is tagged by topic, so the sum keeps one alert for all series.
      - alert: AwapDlqMessages
        expr: sum(increase(awap_dlq_messages_total[5m])) > 5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Dead-letter messages detected"
          description: "{{ $value }} dead-letter messages were consumed in the last 5 minutes."

      - alert: AwapDlqMessagesCritical
        expr: sum(increase(awap_dlq_messages_total[5m])) > 50
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Dead-letter backlog is growing fast"
          description: "{{ $value }} dead-letter messages in 5 minutes; investigate the consumer pipeline immediately."

      # Issue #123: older deployments may still publish to the legacy topic. Any traffic there
      # means the dual-consume window is still needed; drain it with scripts/dlq-legacy-copy.sh.
      - alert: AwapLegacyDlqMessages
        expr: increase(awap_dlq_legacy_messages_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Legacy awap.dlq topic is still receiving dead letters"
          description: "{{ $value }} legacy dead-letter messages in 5 minutes. Run scripts/dlq-legacy-copy.sh and check which deployment still publishes to awap.dlq."

      - alert: AwapDlqQuarantine
        expr: sum(increase(awap_dlq_quarantined_total[5m])) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Malformed dead-letter message quarantined"
          description: "{{ $value }} malformed dead-letter messages were quarantined in the last 5 minutes; inspect the quarantine file before deleting it."

  - name: awap-slo
    rules:
      - alert: AwapHighErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            / clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 1) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Error rate above 5%"
          description: "{{ $value | humanizePercentage }} of requests are failing (5xx)."

      - alert: AwapHighLatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_server_requests_seconds_bucket[5m])) by (le)) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p95 latency above 2s"
          description: "p95 request latency is {{ $value }}s over the last 5 minutes."

      - alert: AwapInstanceDown
        expr: up{job="awap-identity"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "AWAP identity instance is down"
          description: "The awap-identity scrape target has been unreachable for 1 minute."
