groups:
  - name: awap
    rules:
      # A small trickle of DLQ messages is tolerable (transient poison messages are
      # retried before landing here); alert only once a meaningful backlog forms.
      - alert: AwapDlqMessages
        expr: increase(awap_dlq_messages_total[5m]) > 5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Dead-letter messages detected"
          description: "{{ $value }} dead-letter messages were consumed in the last 5 minutes."

      - alert: AwapDlqMessagesCritical
        expr: increase(awap_dlq_messages_total[5m]) > 50
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Dead-letter backlog is growing fast"
          description: "{{ $value }} dead-letter messages in 5 minutes; investigate the consumer pipeline immediately."

  - name: awap-outbox
    rules:
      # A stale claim means a relay died between claiming and publishing (#121). Reconciliation
      # re-queues the row, so a single occurrence is a warning; sustained growth is an outage signal.
      - alert: AwapOutboxStaleClaims
        expr: increase(awap_outbox_stuck_total{reason="stale_claim"}[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Outbox claims are being left behind"
          description: "{{ $value }} outbox claims were released by reconciliation in 15 minutes; a relay is crashing inside the claim/publish window."

      # Rows stranded by the pre-V44 relay: they are never republished automatically, an operator
      # must verify the Kafka record first (runbook O7).
      - alert: AwapOutboxLegacyRows
        expr: increase(awap_outbox_stuck_total{reason="legacy_published_without_timestamp"}[15m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Outbox rows marked published without published_at"
          description: "{{ $value }} legacy outbox rows need manual verification; follow runbook O7."

      - alert: AwapOutboxPublishFailures
        expr: increase(awap_outbox_publish_failures_total[10m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Outbox publishes are failing"
          description: "{{ $value }} outbox publish failures in 10 minutes ({{ $labels.reason }})."

      - alert: AwapOutboxClaimAgeHigh
        expr: awap_outbox_claim_age_seconds_max > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Outbox claims are staying stale for too long"
          description: "The oldest released outbox claim was {{ $value }}s old; reconciliation is not keeping up with crashed relays."

      - alert: AwapOutboxQuarantinedRows
        expr: awap_outbox_exhausted > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Outbox rows are quarantined"
          description: "{{ $value }} outbox rows exhausted their publish attempts and need operator action."

  - name: awap-slo
    rules:
      - alert: AwapHighErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            / clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 1) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Error rate above 5%"
          description: "{{ $value | humanizePercentage }} of requests are failing (5xx)."

      - alert: AwapHighLatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_server_requests_seconds_bucket[5m])) by (le)) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p95 latency above 2s"
          description: "p95 request latency is {{ $value }}s over the last 5 minutes."

      - alert: AwapInstanceDown
        expr: up{job="awap-identity"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "AWAP identity instance is down"
          description: "The awap-identity scrape target has been unreachable for 1 minute."
