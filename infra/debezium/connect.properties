# Kafka Connect worker for the Debezium outbox connector (issue #131).
bootstrap.servers=${CONNECT_BOOTSTRAP_SERVERS}
group.id=awap-connect

key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=org.apache.kafka.connect.json.JsonConverter
value.converter.schemas.enable=false

config.storage.topic=awap.connect.configs
offset.storage.topic=awap.connect.offsets
status.storage.topic=awap.connect.status
config.storage.replication.factor=1
offset.storage.replication.factor=1
status.storage.replication.factor=1

plugin.path=/usr/share/java
rest.host.name=0.0.0.0
rest.port=8083
rest.advertised.host.name=${CONNECT_REST_ADVERTISED_HOST}
producer.override.enable.idempotence=true
producer.override.acks=all
