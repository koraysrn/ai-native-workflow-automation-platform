          type: string
        count:
          type: integer
          format: int64
        totalDurationMs:
          type: integer
          format: int64
        averageDurationMs:
          type: integer
          format: int64

    NotificationTemplateResponse:
      type: object
      required: [id, templateKey, locale, subject, body, version, active]
      properties:
        id:
