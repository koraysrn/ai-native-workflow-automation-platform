          format: uuid
        templateKey:
          type: string
          maxLength: 128
          pattern: "^[a-z0-9][a-z0-9._-]*$"
        locale:
          type: string
          pattern: "^[a-z]{2}(-[A-Z]{2})?$"
          description: Canonical locale (lowercase language, optional uppercase region).
          example: en-US
        subject:
          type: string
        body:
          type: string
        version:
          type: integer
          format: int64
          description: Optimistic locking revision; a stale update returns 409.
