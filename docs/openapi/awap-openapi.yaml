openapi: 3.0.3
info:
  title: AWAP API
  version: v1
  description: >-
    AI-Native Workflow Automation Platform (AWAP) REST API. All mutating
    endpoints accept an `Idempotency-Key` header; a repeated request with the
    same key returns the previously recorded response. Every endpoint is
    tenant-scoped via `X-Tenant-Id` (derived from the authenticated session).
  contact:
    name: AWAP Team
servers:
  - url: http://localhost:8080
    description: Local development

security:
  - bearerAuth: []

tags:
  - name: Health
    description: Liveness and readiness endpoints.
  - name: Auth
    description: Authentication and session management.
  - name: Tenants
    description: Tenant on-boarding, quotas and invitations.
  - name: Organizations
    description: Company, department, team, position and user hierarchy.
  - name: Workflow Definitions
    description: Workflow templates, versioning, draft/publish and rollback.
  - name: Workflow Instances
    description: Workflow execution, state transitions and execution logs.
  - name: Sagas
    description: Saga state inspection and manual compensation intervention.
  - name: Tasks
    description: Task assignment, claiming, approval and rejection.
  - name: Forms
    description: Form definitions and submissions.
  - name: Files
    description: MinIO-backed file upload slots and download URLs.
  - name: Documents
    description: Versioned documents, upload slots and presigned downloads.
  - name: Notifications
    description: Tenant notification inbox and delivery history.
  - name: Analytics
    description: Process, task and approval analytics aggregates.
  - name: Webhooks
    description: Durable webhook delivery queue and dead-letter inspection.

paths:
  /actuator/health:
    get:
      operationId: healthCheck
      summary: Service health
      description: Returns the actuator health status used by probes and load balancers.
      tags: [Health]
      security: []
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: UP

  /api/v1/auth/login:
    post:
      operationId: login
      summary: Authenticate a user
      description: Validates credentials and writes HttpOnly access/refresh token cookies.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenantSlug, email, password]
              properties:
                tenantSlug:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Authentication succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Terminate the session
      description: Revokes the refresh token and clears the session cookies.
      tags: [Auth]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Logged out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /api/v1/auth/refresh:
    post:
      operationId: refreshToken
      summary: Rotate the refresh token
      description: Exchanges the current refresh token for a new token pair (rotation).
      tags: [Auth]
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: New token pair issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/me:
    get:
      operationId: currentUser
      summary: Current authenticated user
      description: Returns the profile of the authenticated user.
      tags: [Auth]
      responses:
        "200":
          description: Current user profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/tenants:
    get:
      operationId: listTenantMemberships
      summary: Tenant memberships of the current user
      description: Returns the tenants the authenticated user belongs to.
      tags: [Auth]
      responses:
        "200":
          description: Tenant memberships.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TenantMembershipResponse"

  /api/v1/auth/csrf:
    get:
      operationId: issueCsrfToken
      summary: Issue the CSRF bootstrap token
      description: >-
        Forces a CSRF token to be generated and returns it. The response also sets the readable
        `XSRF-TOKEN` cookie that the browser client echoes in `X-XSRF-TOKEN`.
      tags: [Auth]
      responses:
        "200":
          description: CSRF token issued.
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/tenants:
    post:
      operationId: createTenant
      summary: On-board a new tenant
      description: Creates a tenant together with its administrator account.
      tags: [Tenants]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, name, adminEmail, adminPassword, adminFullName]
              properties:
                slug:
                  type: string
                name:
                  type: string
                adminEmail:
                  type: string
                  format: email
                adminPassword:
                  type: string
                  format: password
                adminFullName:
                  type: string
      responses:
        "201":
          description: Tenant created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantResponse"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/tenants/{id}:
    get:
      operationId: getTenant
      summary: Tenant detail
      description: Returns a tenant. Only the owning tenant administrator may read it.
      tags: [Tenants]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Tenant detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/tenants/{id}/limits:
    put:
      operationId: updateTenantLimits
      summary: Update tenant quotas
      description: Updates plan-based resource quotas of a tenant.
      tags: [Tenants]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                maxUsers:
                  type: integer
                maxWorkflows:
                  type: integer
                maxWorkflowExecutionsPerMonth:
                  type: integer
      responses:
        "200":
          description: Updated tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantResponse"

  /api/v1/tenants/{id}/usage:
    get:
      operationId: getTenantUsage
      summary: Tenant usage and remaining quota
      description: >-
        Returns per UTC day counters for the requested window. Unknown metric keys are
        rejected with 400, a soft-deleted or unknown tenant with 404, and cross-tenant
        reads without SYSTEM_ADMIN with 403. Metrics without usage report zero values.
      tags: [Tenants]
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/UsageFrom"
        - $ref: "#/components/parameters/UsageTo"
        - $ref: "#/components/parameters/UsageMetric"
      responses:
        "200":
          description: Usage report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/tenants/{id}/invitations:
    post:
      operationId: inviteTenantUser
      summary: Invite a user to a tenant
      description: Creates an invitation for a user within the tenant.
      tags: [Tenants]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email:
                  type: string
                  format: email
                role:
                  type: string
      responses:
        "201":
          description: Invitation created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationResponse"

  /api/v1/organizations/companies:
    get:
      operationId: listCompanies
      summary: List companies
      description: Lists companies in the current tenant.
      tags: [Organizations]
      responses:
        "200":
          description: Companies.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CompanyResponse"
    post:
      operationId: createCompany
      summary: Create a company
      description: Creates a company in the current tenant.
      tags: [Organizations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "201":
          description: Company created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyResponse"

  /api/v1/organizations/departments:
    get:
      operationId: listDepartments
      summary: List departments
      description: Lists departments for a company.
      tags: [Organizations]
      parameters:
        - name: companyId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Departments.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DepartmentResponse"
    post:
      operationId: createDepartment
      summary: Create a department
      description: Creates a department under a company.
      tags: [Organizations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [companyId, name]
              properties:
                companyId:
                  type: string
                  format: uuid
                parentId:
                  type: string
                  format: uuid
                  nullable: true
                name:
                  type: string
      responses:
        "201":
          description: Department created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepartmentResponse"

  /api/v1/organizations/teams:
    get:
      operationId: listTeams
      summary: List teams
      description: Lists teams for a department.
      tags: [Organizations]
      parameters:
        - name: departmentId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Teams.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamResponse"
    post:
      operationId: createTeam
      summary: Create a team
      description: Creates a team under a department.
      tags: [Organizations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [departmentId, name]
              properties:
                departmentId:
                  type: string
                  format: uuid
                name:
                  type: string
      responses:
        "201":
          description: Team created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamResponse"

  /api/v1/organizations/positions:
    get:
      operationId: listPositions
      summary: List positions
      description: Lists positions in the current tenant.
      tags: [Organizations]
      responses:
        "200":
          description: Positions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PositionResponse"
    post:
      operationId: createPosition
      summary: Create a position
      description: Creates a position in the current tenant.
      tags: [Organizations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "201":
          description: Position created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PositionResponse"

  /api/v1/organizations/users:
    get:
      operationId: listOrgUsers
      summary: List organization users
      description: Lists organization users in the current tenant.
      tags: [Organizations]
      responses:
        "200":
          description: Organization users.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrgUserResponse"
    post:
      operationId: createOrgUser
      summary: Create an organization user
      description: Creates an organization user placed into a team and position.
      tags: [Organizations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, fullName]
              properties:
                email:
                  type: string
                  format: email
                fullName:
                  type: string
                teamId:
                  type: string
                  format: uuid
                  nullable: true
                positionId:
                  type: string
                  format: uuid
                  nullable: true
      responses:
        "201":
          description: Organization user created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgUserResponse"

  /api/v1/organizations/users/{id}/assign:
    post:
      operationId: assignOrgUserToTeam
      summary: Assign a user to a team
      description: Assigns an organization user to a team.
      tags: [Organizations]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [teamId]
              properties:
                teamId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: User assigned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgUserResponse"

  /api/v1/organizations/tree:
    get:
      operationId: organizationTree
      summary: Organization hierarchy tree
      description: Returns the full company -> department -> team -> user tree.
      tags: [Organizations]
      responses:
        "200":
          description: Organization tree.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /api/v1/workflow-definitions:
    get:
      operationId: listWorkflowDefinitions
      summary: List workflow definitions
      description: Lists workflow definitions in the current tenant.
      tags: [Workflow Definitions]
      responses:
        "200":
          description: Workflow definitions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkflowDefinitionResponse"
    post:
      operationId: createWorkflowDefinition
      summary: Create a workflow definition
      description: Creates a workflow definition as a draft with its first version.
      tags: [Workflow Definitions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, definitionJson]
              properties:
                name:
                  type: string
                description:
                  type: string
                  nullable: true
                definitionJson:
                  type: string
      responses:
        "201":
          description: Draft created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDefinitionResponse"

  /api/v1/workflow-definitions/{id}:
    get:
      operationId: getWorkflowDefinition
      summary: Get a workflow definition
      description: Returns a single workflow definition.
      tags: [Workflow Definitions]
      parameters:
        - $ref: "#/components/parameters/WorkflowDefinitionId"
      responses:
        "200":
          description: Workflow definition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDefinitionResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/workflow-definitions/{id}/publish:
    post:
      operationId: publishWorkflowDefinition
      summary: Publish the latest version
      description: Publishes the latest draft version of a workflow definition.
      tags: [Workflow Definitions]
      parameters:
        - $ref: "#/components/parameters/WorkflowDefinitionId"
      responses:
        "200":
          description: Published definition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDefinitionResponse"

  /api/v1/workflow-definitions/{id}/rollback/{version}:
    post:
      operationId: rollbackWorkflowDefinition
      summary: Rollback to a previous version
      description: Activates a previous version of a workflow definition.
      tags: [Workflow Definitions]
      parameters:
        - $ref: "#/components/parameters/WorkflowDefinitionId"
        - name: version
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Rolled-back definition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDefinitionResponse"

  /api/v1/workflow-definitions/{id}/versions:
    get:
      operationId: listWorkflowVersions
      summary: List workflow versions
      description: >-
        Lists version snapshots of a workflow definition, including the publish status, whether the
        version is archived and whether it is the version the definition currently resolves to.
      tags: [Workflow Definitions]
      parameters:
        - $ref: "#/components/parameters/WorkflowDefinitionId"
      responses:
        "200":
          description: Versions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkflowVersionResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/workflow-definitions/{id}/versions/{version}/archive:
    post:
      operationId: archiveWorkflowVersion
      summary: Archive a workflow version
      description: Soft-deletes a workflow version snapshot.
      tags: [Workflow Definitions]
      parameters:
        - $ref: "#/components/parameters/WorkflowDefinitionId"
        - name: version
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Version archived.

  /api/v1/workflow-definitions/validate-expression:
    post:
      operationId: validateWorkflowExpression
      summary: Dry-run a workflow expression
      description: >-
        Parses and validates a SpEL condition without persisting a definition. A blank expression is
        valid because it denotes an unconditional transition. Validation failures are returned as
        field-level errors on the `expression` field so the designer can render them inline and
        block saving an invalid graph.
      tags: [Workflow Definitions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpressionValidationRequest"
      responses:
        "200":
          description: Validation result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpressionValidationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/workflow-instances:
    get:
      operationId: listWorkflowInstances
      summary: List workflow instances
      description: Lists workflow instances in the current tenant.
      tags: [Workflow Instances]
      responses:
        "200":
          description: Workflow instances.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkflowInstanceResponse"
    post:
      operationId: startWorkflowInstance
      summary: Start a workflow instance
      description: Starts a new instance from a published workflow version.
      tags: [Workflow Instances]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workflowDefinitionId]
              properties:
                workflowDefinitionId:
                  type: string
                  format: uuid
                contextJson:
                  type: string
                idempotencyKey:
                  type: string
                  nullable: true
      responses:
        "201":
          description: Instance started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowInstanceResponse"

  /api/v1/workflow-instances/{id}:
    get:
      operationId: getWorkflowInstance
      summary: Get a workflow instance
      description: Returns a single workflow instance.
      tags: [Workflow Instances]
      parameters:
        - $ref: "#/components/parameters/WorkflowInstanceId"
      responses:
        "200":
          description: Workflow instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowInstanceResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/workflow-instances/{id}/logs:
    get:
      operationId: listWorkflowInstanceLogs
      summary: List execution logs
      description: Returns the ordered execution log of an instance.
      tags: [Workflow Instances]
      parameters:
        - $ref: "#/components/parameters/WorkflowInstanceId"
      responses:
        "200":
          description: Execution logs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExecutionLogResponse"

  /api/v1/workflow-instances/{id}/nodes/{nodeId}/complete:
    post:
      operationId: completeWorkflowNode
      summary: Complete a waiting node
      description: Completes an external (FORM/APPROVAL/TASK) node with its output.
      tags: [Workflow Instances]
      parameters:
        - $ref: "#/components/parameters/WorkflowInstanceId"
        - name: nodeId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                outputJson:
                  type: string
      responses:
        "200":
          description: Node completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowInstanceResponse"

  /api/v1/workflow-instances/{id}/complete:
    post:
      operationId: completeWorkflowInstance
      summary: Complete an instance
      description: Forces the instance into the COMPLETED state.
      tags: [Workflow Instances]
      parameters:
        - $ref: "#/components/parameters/WorkflowInstanceId"
      responses:
        "200":
          description: Completed instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowInstanceResponse"

  /api/v1/workflow-instances/{id}/retry:
    post:
      operationId: retryWorkflowInstance
      summary: Retry a failed instance
      description: Resumes failed nodes of a failed instance.
      tags: [Workflow Instances]
      parameters:
        - $ref: "#/components/parameters/WorkflowInstanceId"
      responses:
        "200":
          description: Retried instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowInstanceResponse"

  /api/v1/workflow-instances/{id}/replay:
    post:
      operationId: replayWorkflowInstance
      summary: Replay an instance from its execution log
      description: >-
        Folds the ordered execution log into an immutable projection, compares it with the persisted
        instance and node executions, and records a replay_runs audit row. With dryRun=true the
        projection report is returned and no outbox, instance or node row is written. Without
        dryRun the replay is audited, guarded by a per-instance lock and optimistic version, and
        then re-drives the instance. A divergence raises REPLAY_DIVERGENCE (409).
      tags: [Workflow Instances]
      parameters:
        - $ref: "#/components/parameters/WorkflowInstanceId"
        - name: dryRun
          in: query
          required: false
          description: >-
            When true, only projects and compares the log; zero side effects other than the audit
            row.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: >-
            Dry-run returns a projection report; a real replay returns the replayed instance.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReplayReport"
                  - $ref: "#/components/schemas/WorkflowInstanceResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          description: The execution log exceeds the configured replay row cap.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "422":
          description: The replay exceeded its configured execution timeout.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /api/v1/workflow-instances/{id}/fail:
    post:
      operationId: failWorkflowInstance
      summary: Fail an instance
      description: Forces the instance into the FAILED state.
      tags: [Workflow Instances]
      parameters:
        - $ref: "#/components/parameters/WorkflowInstanceId"
      responses:
        "200":
          description: Failed instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowInstanceResponse"

  /api/v1/workflow-instances/{id}/cancel:
    post:
      operationId: cancelWorkflowInstance
      summary: Cancel an instance
      description: Forces the instance into the CANCELLED state.
      tags: [Workflow Instances]
      parameters:
        - $ref: "#/components/parameters/WorkflowInstanceId"
      responses:
        "200":
          description: Cancelled instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowInstanceResponse"

  /api/v1/workflow-instances/{id}/pause:
    post:
      operationId: pauseWorkflowInstance
      summary: Pause an instance
      description: Pauses a RUNNING or WAITING instance.
      tags: [Workflow Instances]
      parameters:
        - $ref: "#/components/parameters/WorkflowInstanceId"
      responses:
        "200":
          description: Paused instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowInstanceResponse"

  /api/v1/workflow-instances/{id}/resume:
    post:
      operationId: resumeWorkflowInstance
      summary: Resume an instance
      description: Resumes a PAUSED instance.
      tags: [Workflow Instances]
      parameters:
        - $ref: "#/components/parameters/WorkflowInstanceId"
      responses:
        "200":
          description: Resumed instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowInstanceResponse"

  /api/v1/workflow-instances/{id}/saga:
    get:
      operationId: getWorkflowInstanceSaga
      summary: Get the saga of an instance
      description: >-
        Returns the tenant-scoped saga coordinator row and every recorded step in execution order.
        Steps include status, attempt count, next retry instant and the last compensation error.
      tags: [Sagas]
      parameters:
        - $ref: "#/components/parameters/WorkflowInstanceId"
      responses:
        "200":
          description: Saga state and steps.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SagaResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/workflow-instances/{id}/saga/compensate:
    post:
      operationId: compensateWorkflowInstanceSaga
      summary: Manually start or resume saga compensation
      description: >-
        Manual intervention for an operator. Starts reverse compensation for a running saga or
        reopens every dead-lettered step after the external system was fixed. The request is
        idempotent: a compensated saga is returned unchanged.
      tags: [Sagas]
      parameters:
        - $ref: "#/components/parameters/WorkflowInstanceId"
      responses:
        "200":
          description: Saga state after the manual compensation attempt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SagaResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/workflow-instances/{id}/saga/steps/{stepId}/retry:
    post:
      operationId: retryWorkflowInstanceSagaStep
      summary: Retry one dead-lettered compensation step
      description: >-
        Re-arms one dead-lettered step and resumes compensation. Reverse ordering is enforced: a
        lower step cannot be retried while a later step is still uncompensated (409).
      tags: [Sagas]
      parameters:
        - $ref: "#/components/parameters/WorkflowInstanceId"
        - name: stepId
          in: path
          required: true
          description: Saga step UUID.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Saga state after the step retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SagaResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/tasks:
    get:
      operationId: listTasks
      summary: List tasks
      description: Lists tasks in the current tenant.
      tags: [Tasks]
      responses:
        "200":
          description: Tasks.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskResponse"
    post:
      operationId: createTask
      summary: Create a task
      description: Creates a task, optionally linked to a workflow node execution.
      tags: [Tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                description:
                  type: string
                  nullable: true
                workflowInstanceId:
                  type: string
                  format: uuid
                  nullable: true
                nodeExecutionId:
                  type: string
                  format: uuid
                  nullable: true
                assigneeId:
                  type: string
                  format: uuid
                  nullable: true
      responses:
        "201":
          description: Task created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"

  /api/v1/tasks/mine:
    get:
      operationId: listMyTasks
      summary: List my tasks
      description: Lists tasks assigned to the current user.
      tags: [Tasks]
      responses:
        "200":
          description: Tasks.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskResponse"

  /api/v1/tasks/{id}/assign:
    post:
      operationId: assignTask
      summary: Assign a task
      description: Assigns a task to a user.
      tags: [Tasks]
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assigneeId]
              properties:
                assigneeId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Assigned task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"

  /api/v1/tasks/{id}/claim:
    post:
      operationId: claimTask
      summary: Claim a task
      description: Claims an open task for the current user.
      tags: [Tasks]
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Claimed task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"

  /api/v1/tasks/{id}/approve:
    post:
      operationId: approveTask
      summary: Approve a task
      description: Approves a task and publishes the completion event.
      tags: [Tasks]
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Approved task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"

  /api/v1/tasks/{id}/reject:
    post:
      operationId: rejectTask
      summary: Reject a task
      description: Rejects a task and publishes the completion event.
      tags: [Tasks]
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Rejected task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"

  /api/v1/tasks/{id}/complete:
    post:
      operationId: completeTask
      summary: Complete a task
      description: Marks an in-progress or assigned task as completed.
      tags: [Tasks]
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Completed task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"

  /api/v1/forms:
    get:
      operationId: listForms
      summary: List form definitions
      description: Lists form definitions in the current tenant.
      tags: [Forms]
      responses:
        "200":
          description: Form definitions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FormDefinitionResponse"
    post:
      operationId: createFormDefinition
      summary: Create a form definition
      description: Creates a form definition with a validated schema.
      tags: [Forms]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, schemaJson]
              properties:
                name:
                  type: string
                schemaJson:
                  type: string
      responses:
        "201":
          description: Form definition created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormDefinitionResponse"

  /api/v1/forms/{id}:
    get:
      operationId: getFormDefinition
      summary: Get a form definition
      description: Returns a single form definition.
      tags: [Forms]
      parameters:
        - $ref: "#/components/parameters/FormId"
      responses:
        "200":
          description: Form definition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormDefinitionResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateFormDefinition
      summary: Update a form definition
      description: Updates a form definition and increments its version.
      tags: [Forms]
      parameters:
        - $ref: "#/components/parameters/FormId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, schemaJson]
              properties:
                name:
                  type: string
                schemaJson:
                  type: string
      responses:
        "200":
          description: Updated form definition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormDefinitionResponse"

  /api/v1/forms/{id}/submissions:
    get:
      operationId: listFormSubmissions
      summary: List form submissions
      description: Lists submissions for a form definition.
      tags: [Forms]
      parameters:
        - $ref: "#/components/parameters/FormId"
      responses:
        "200":
          description: Submissions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FormSubmissionResponse"
    post:
      operationId: submitForm
      summary: Submit a form
      description: Validates and stores a submission against a form definition.
      tags: [Forms]
      parameters:
        - $ref: "#/components/parameters/FormId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dataJson]
              properties:
                dataJson:
                  type: string
                workflowInstanceId:
                  type: string
                  format: uuid
                  nullable: true
                nodeExecutionId:
                  type: string
                  format: uuid
                  nullable: true
      responses:
        "201":
          description: Submission stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormSubmissionResponse"

  /api/v1/files:
    post:
      operationId: createFileUpload
      summary: Create a quarantined file upload slot
      description: >-
        Creates a short-lived (<= 5 minutes) presigned PUT that targets the `awap-quarantine`
        bucket only. Files are promoted to `awap-files` after ClamAV clears them. Allowed
        extensions: pdf, docx, xlsx, pptx, png, jpg, jpeg, txt; maximum size 500 MB.
      tags: [Files]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, size]
              properties:
                name:
                  type: string
                contentType:
                  type: string
                size:
                  type: integer
                  minimum: 1
                  maximum: 524288000
      responses:
        "201":
          description: Upload slot created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  fileId:
                    type: string
                    format: uuid
                  uploadUrl:
                    type: string
        "400":
          description: Empty file or invalid request.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "413":
          description: File exceeds the 500 MB limit.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "415":
          description: File extension is not supported.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /api/v1/files/{id}:
    get:
      operationId: getFileDownloadUrl
      summary: Get a file download URL
      description: >-
        Returns a presigned GET on `awap-files` only when the file is PROMOTED. INFECTED returns
        403, SCAN_FAILED returns 503, and files still quarantined/scanning return 409.
      tags: [Files]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Download URL.
          content:
            application/json:
              schema:
                type: object
                properties:
                  downloadUrl:
                    type: string
        "403":
          description: The file was rejected by antivirus scanning.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: File not found for this tenant.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: The file is still quarantined or being scanned.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "503":
          description: The antivirus scan failed; promotion has not happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /api/v1/workflow-instances/{id}/recover:
    post:
      operationId: recoverWorkflowInstance
      summary: Recover a workflow instance
      description: Continues a RUNNING or FAILED instance from its last durable node execution.
      tags: [Workflow Instances]
      parameters:
        - $ref: "#/components/parameters/WorkflowInstanceId"
      responses:
        "200":
          description: Recovered instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowInstanceResponse"

  /api/v1/documents:
    post:
      operationId: createDocumentUpload
      summary: Create a document upload slot
      description: >-
        Creates a presigned MinIO PUT slot and registers a PENDING document version. The file is
        only downloadable after the antivirus scan clears it.
      tags: [Documents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, size]
              properties:
                name:
                  type: string
                contentType:
                  type: string
                size:
                  type: integer
                  format: int64
                  minimum: 0
      responses:
        "201":
          description: Upload slot and PENDING version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateDocumentResponse"
    get:
      operationId: listDocuments
      summary: List tenant document versions
      description: Returns every live document version owned by the caller's tenant.
      tags: [Documents]
      responses:
        "200":
          description: Document versions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentVersionResponse"

  /api/v1/documents/events:
    get:
      operationId: streamDocumentScanEvents
      summary: Stream tenant document scan status changes
      description: >-
        Server-Sent Events stream of antivirus scan transitions (QUARANTINED, SCANNING, CLEAN,
        PROMOTED, INFECTED, SCAN_FAILED). Status changes use the `scan-status` event; a deleted
        document emits `document-deleted` with `{ fileId }` and closes its per-file stream. The
        stream is tenant-scoped, starts with a snapshot of current statuses, emits heartbeats to
        defeat proxy buffering and never includes another tenant's file. Clients fall back to
        polling `GET /api/v1/documents` when SSE is unavailable.
      tags: [Documents]
      parameters:
        - name: fileId
          in: query
          required: false
          description: When present, only that file's events are streamed after an ownership check.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: SSE stream; event name `scan-status` with a JSON data payload.
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: The caller exceeded the per-user open-stream limit.

  /api/v1/documents/{fileId}/events:
    get:
      operationId: streamDocumentScanEventsForFile
      summary: Stream one document's scan status changes
      description: >-
        Same event contract as the tenant stream, narrowed to one file. The ownership check runs
        before the stream opens; a cross-tenant id returns 404 and never leaks the filename.
      tags: [Documents]
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: SSE stream; event name `scan-status` with a JSON data payload.
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/documents/{fileId}/versions:
    get:
      operationId: listDocumentVersions
      summary: List versions of one document
      description: Returns the version history of a document, tenant-scoped in the query.
      tags: [Documents]
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Document versions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentVersionResponse"

  /api/v1/documents/{fileId}/download:
    get:
      operationId: getDocumentDownloadUrl
      summary: Get a presigned document download URL
      description: Rejects the request when the file is still PENDING or was found infected.
      tags: [Documents]
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Download URL.
          content:
            application/json:
              schema:
                type: object
                properties:
                  downloadUrl:
                    type: string
        "403":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/documents/versions/{versionId}/archive:
    post:
      operationId: archiveDocumentVersion
      summary: Archive a document version
      description: Marks the version archived for retention while keeping its metadata.
      tags: [Documents]
      parameters:
        - name: versionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Archived version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentVersionResponse"

  /api/v1/documents/versions/{versionId}:
    delete:
      operationId: deleteDocumentVersion
      summary: Soft-delete a document version
      description: Keeps the row for audit/retention while hiding it from listings.
      tags: [Documents]
      parameters:
        - name: versionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Soft-deleted version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentVersionResponse"

  /api/v1/notifications:
    get:
      operationId: listNotifications
      summary: List notification deliveries
      description: >-
        Tenant-scoped inbox and delivery history, including web notifications.
        Rows are ordered newest first and carry their read/unread state.
      tags: [Notifications]
      parameters:
        - name: unreadOnly
          in: query
          required: false
          description: When true only unread notifications are returned.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Notification deliveries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificationDeliveryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/notifications/unread-count:
    get:
      operationId: getUnreadNotificationCount
      summary: Count unread notifications
      description: >-
        Unread badge count for the tenant. Always matches the size of the
        `unreadOnly=true` listing.
      tags: [Notifications]
      responses:
        "200":
          description: Unread notification count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadNotificationCountResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      summary: Mark a notification read
      description: >-
        Idempotent. Repeating the call returns the same stored `readAt` and the
        unread count decreases at most once. A notification from another tenant
        is answered with 404 so the endpoint cannot be used to probe foreign
        identifiers.
      tags: [Notifications]
      parameters:
        - $ref: "#/components/parameters/NotificationId"
      responses:
        "200":
          description: The notification with its current read state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationDeliveryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/notifications/{id}/unread:
    patch:
      operationId: markNotificationUnread
      summary: Mark a notification unread
      description: >-
        Idempotent. Restores the unread state and the unread badge; repeating the
        call keeps the notification unread without side effects.
      tags: [Notifications]
      parameters:
        - $ref: "#/components/parameters/NotificationId"
      responses:
        "200":
          description: The notification with its current read state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationDeliveryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/notification-templates:
    get:
      operationId: listNotificationTemplates
      summary: List tenant notification templates
      description: >-
        Returns the current revision of every template owned by the tenant,
        optionally filtered by template key.
      tags: [Notifications]
      parameters:
        - name: templateKey
          in: query
          required: false
          schema:
            type: string
            maxLength: 128
      responses:
        "200":
          description: Current template revisions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificationTemplateResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createNotificationTemplate
      summary: Create a notification template
      description: >-
        Placeholders must look like `{{name}}`; the body is limited to 1 MiB and
        HTML in variables is escaped at render time.
      tags: [Notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNotificationTemplateRequest"
      responses:
        "201":
          description: Created template.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationTemplateResponse"
        "400":
          description: Invalid template payload or placeholders.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/notification-templates/preview:
    post:
      operationId: previewNotificationTemplate
      summary: Preview a notification template
      description: >-
        Renders the supplied (or stored) template with the variables and returns
        the escaped subject/body. Nothing is sent. Unknown placeholders are
        rejected with 400.
      tags: [Notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreviewNotificationTemplateRequest"
      responses:
        "200":
          description: Rendered preview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationTemplatePreviewResponse"
        "400":
          description: Invalid placeholders, variables or template body.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/notification-templates/{id}:
    get:
      operationId: getNotificationTemplate
      summary: Get one notification template
      description: Returns the current revision of one tenant template.
      tags: [Notifications]
      parameters:
        - $ref: "#/components/parameters/NotificationTemplateId"
      responses:
        "200":
          description: Template revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationTemplateResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateNotificationTemplate
      summary: Save a new template revision
      description: >-
        Requires the revision the editor based its change on. A stale
        `expectedVersion` returns 409 and the previous revision stays in the
        audit trail.
      tags: [Notifications]
      parameters:
        - $ref: "#/components/parameters/NotificationTemplateId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNotificationTemplateRequest"
      responses:
        "200":
          description: Updated template.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationTemplateResponse"
        "400":
          description: Invalid template payload or placeholders.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/notification-templates/{id}/versions:
    get:
      operationId: listNotificationTemplateVersions
      summary: List the template revision history
      description: Returns the audited revisions of one template, newest first.
      tags: [Notifications]
      parameters:
        - $ref: "#/components/parameters/NotificationTemplateId"
      responses:
        "200":
          description: Audited revisions, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificationTemplateVersionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/notification-templates/{id}/archive:
    post:
      operationId: archiveNotificationTemplate
      summary: Archive a notification template
      description: >-
        Deactivates the template so delivery falls back to the built-in default.
        Idempotent.
      tags: [Notifications]
      parameters:
        - $ref: "#/components/parameters/NotificationTemplateId"
      responses:
        "200":
          description: Archived template.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationTemplateResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/notification-templates/{id}/activate:
    post:
      operationId: activateNotificationTemplate
      summary: Re-activate a notification template
      description: Restores an archived template to the active delivery path. Idempotent.
      tags: [Notifications]
      parameters:
        - $ref: "#/components/parameters/NotificationTemplateId"
      responses:
        "200":
          description: Activated template.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationTemplateResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/analytics/summary:
    get:
      operationId: getAnalyticsSummary
      summary: Get process analytics aggregates
      description: Returns tenant/day process, task and approval aggregates for the selected window.
      tags: [Analytics]
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Tenant/day aggregates.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnalyticsAggregateResponse"

  /api/v1/webhook-deliveries:
    get:
      operationId: listWebhookDeliveries
      summary: List webhook deliveries
      description: >-
        Tenant-scoped view of the durable delivery queue used by WEBHOOK workflow nodes. Filter
        with `status=DEAD` to inspect dead-letter rows. Payloads, HMAC signatures and URL query
        strings are never returned.
      tags: [Webhooks]
      parameters:
        - name: status
          in: query
          required: false
          description: Optional delivery status filter.
          schema:
            type: string
            enum: [PENDING, RETRYING, SENT, DEAD, CANCELLED]
        - name: limit
          in: query
          required: false
          description: Maximum number of rows (1-100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Deliveries of the current tenant, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WebhookDeliveryResponse"
        "400":
          description: The status filter is not a known delivery status.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The caller does not hold INSTANCE_READ.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Access tokens are issued as HttpOnly cookies and may also be sent as a
        Bearer token. Mutating requests additionally require the CSRF token
        (X-XSRF-TOKEN header).

  parameters:
    TenantId:
      name: id
      in: path
      required: true
      description: Tenant UUID.
      schema:
        type: string
        format: uuid
    WorkflowDefinitionId:
      name: id
      in: path
      required: true
      description: Workflow definition UUID.
      schema:
        type: string
        format: uuid
    WorkflowInstanceId:
      name: id
      in: path
      required: true
      description: Workflow instance UUID.
      schema:
        type: string
        format: uuid
    TaskId:
      name: id
      in: path
      required: true
      description: Task UUID.
      schema:
        type: string
        format: uuid
    FormId:
      name: id
      in: path
      required: true
      description: Form definition UUID.
      schema:
        type: string
        format: uuid
    UsageFrom:
      name: from
      in: query
      required: false
      description: First UTC day of the window (inclusive). Defaults to 29 days before `to`.
      schema:
        type: string
        format: date
    UsageTo:
      name: to
      in: query
      required: false
      description: Last UTC day of the window (inclusive). Defaults to today (UTC).
      schema:
        type: string
        format: date
    UsageMetric:
      name: metric
      in: query
      required: false
      description: Restricts the report to one metric key.
      schema:
        type: string
        enum:
          - workflow_executions
          - task_decisions
          - ai_calls
          - document_bytes
          - active_users
          - api_requests
    NotificationId:
      name: id
      in: path
      required: true
      description: Notification delivery UUID.
      schema:
        type: string
        format: uuid
    NotificationTemplateId:
      name: id
      in: path
      required: true
      description: Notification template UUID.
      schema:
        type: string
        format: uuid

  responses:
    NotFound:
      description: The requested resource was not found.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    BadRequest:
      description: The request parameters or payload are invalid.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Forbidden:
      description: The caller lacks the required authority.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Unauthorized:
      description: Authentication is required.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Conflict:
      description: The request conflicts with the current state.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    TooManyRequests:
      description: Rate limit or tenant daily quota exceeded.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until the limit resets.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"

  schemas:
    ReplayReport:
      type: object
      description: Projection report of a deterministic log replay.
      required: [instanceId, dryRun, result, projection, divergences, logRows, stateHash]
      properties:
        instanceId:
          type: string
          format: uuid
        dryRun:
          type: boolean
        result:
          type: string
          enum: [MATCHED, DIVERGED]
        errorCode:
          type: string
          nullable: true
          example: AWAP-ENG-0004
        projection:
          $ref: "#/components/schemas/ReplayStateView"
        divergences:
          type: array
          items:
            $ref: "#/components/schemas/ReplayDivergenceView"
        logRows:
          type: integer
        logPages:
          type: integer
        durationMs:
          type: integer
          format: int64
        stateHash:
          type: string

    ReplayStateView:
      type: object
      description: Redacted projection of an instance rebuilt from its execution log.
      properties:
        instanceId:
          type: string
          format: uuid
        instanceState:
          type: string
          enum: [CREATED, STARTED, RUNNING, WAITING, COMPLETED, FAILED, CANCELLED, PAUSED]
        currentNodeId:
          type: string
          nullable: true
        nodeStatuses:
          type: object
          additionalProperties:
            type: string
        branchTokens:
          type: object
          additionalProperties:
            type: integer
        mergedBranches:
          type: object
          additionalProperties:
            type: integer
        outputSummaries:
          type: object
          additionalProperties:
            type: string
        appliedActions:
          type: integer

    ReplayDivergenceView:
      type: object
      description: One difference between the log projection and the persisted state.
      required: [type, detail]
      properties:
        type:
          type: string
          enum:
            - UNKNOWN_ACTION
            - MALFORMED_LOG
            - MALFORMED_PAYLOAD
            - OUT_OF_ORDER_LOG
            - EXTERNAL_RESULT_MISSING
            - INSTANCE_STATE_MISMATCH
            - MISSING_NODE_COMPLETION
            - NODE_STATUS_MISMATCH
            - NODE_NOT_PERSISTED
            - BRANCH_TOKEN_MISMATCH
            - BRANCH_MERGE_MISMATCH
        nodeId:
          type: string
          nullable: true
        detail:
          type: string

    ProblemDetails:
      type: object
      description: RFC 7807 problem detail.
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
        code:
          type: string
          example: AWAP-COMMON-0003
        timestamp:
          type: string
          format: date-time

    MessageResponse:
      type: object
      properties:
        message:
          type: string

    UsageDay:
      type: object
      required: [day, value]
      properties:
        day:
          type: string
          format: date
        value:
          type: integer
          format: int64

    UsageMetricUsage:
      type: object
      required: [metric, unit, total, limit, remaining, days]
      properties:
        metric:
          type: string
          description: Stable metric key (bounded enum, never a free-form label).
          example: workflow_executions
        unit:
          type: string
          enum: [COUNT, BYTES]
        total:
          type: integer
          format: int64
        limit:
          type: integer
          format: int64
          description: Effective daily limit (tenant override or metric default).
        remaining:
          type: integer
          format: int64
          description: limit - total, floored at zero; -1 when the metric is uncapped.
        days:
          type: array
          items:
            $ref: "#/components/schemas/UsageDay"

    UsageResponse:
      type: object
      required: [tenantId, from, to, metrics]
      properties:
        tenantId:
          type: string
          format: uuid
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/UsageMetricUsage"

    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
          nullable: true
        refreshToken:
          type: string
          nullable: true
        expiresIn:
          type: integer
          format: int64

    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        email:
          type: string
        fullName:
          type: string
        role:
          type: string

    TenantMembershipResponse:
      type: object
      properties:
        tenantId:
          type: string
          format: uuid
        role:
          type: string

    TenantResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string

    InvitationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string

    CompanyResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        name:
          type: string

    DepartmentResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        parentId:
          type: string
          format: uuid
          nullable: true
        name:
          type: string

    TeamResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        departmentId:
          type: string
          format: uuid
        name:
          type: string

    PositionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        name:
          type: string

    OrgUserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        email:
          type: string
        fullName:
          type: string
        teamId:
          type: string
          format: uuid
          nullable: true
        positionId:
          type: string
          format: uuid
          nullable: true

    WorkflowDefinitionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
        currentVersion:
          type: integer

    WorkflowVersionResponse:
      type: object
      description: >-
        A workflow version snapshot. `status` is the publish state (DRAFT or PUBLISHED), `archived`
        marks soft-deleted snapshots that cannot be selected by SUB_PROCESS, and `current` marks the
        version the definition currently resolves to.
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        definitionJson:
          type: string
        status:
          type: string
          enum: [DRAFT, PUBLISHED]
        archived:
          type: boolean
        current:
          type: boolean
        createdAt:
          type: string
          format: date-time

    ExpressionValidationRequest:
      type: object
      description: >-
        Dry-run condition validation request. The expression may be blank, which means the
        transition is unconditional.
      required: [expression]
      properties:
        expression:
          type: string
          maxLength: 2000
          example: "#amount > 100"

    ExpressionValidationResponse:
      type: object
      description: >-
        Dry-run result. `valid` is false when `errors` contains a field-level problem such as a
        malformed expression, a forbidden pattern or an oversized condition.
      required: [valid, errors]
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ExpressionFieldError"

    ExpressionFieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          enum: [expression]
        message:
          type: string
          example: "Expression contains a forbidden pattern: T("

    SagaResponse:
      type: object
      description: Saga coordinator state for one workflow instance.
      required: [id, tenantId, workflowInstanceId, sagaKey, status, createdAt, steps]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        workflowInstanceId:
          type: string
          format: uuid
        sagaKey:
          type: string
          example: "workflow:0d7c7f3e-8f0f-4d4c-9a2e-0e6b8e6a1b2c"
        status:
          type: string
          enum: [RUNNING, COMPLETED, COMPENSATING, COMPENSATED, FAILED]
        failureReason:
          type: string
          nullable: true
        compensationStartedAt:
          type: string
          format: date-time
          nullable: true
        compensationCompletedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        steps:
          type: array
          items:
            $ref: "#/components/schemas/SagaStepResponse"

    SagaStepResponse:
      type: object
      description: One successfully executed action and its compensating transaction.
      required: [id, stepOrder, nodeId, actionType, compensationType, status, attempts, maxAttempts]
      properties:
        id:
          type: string
          format: uuid
        stepOrder:
          type: integer
        nodeId:
          type: string
        nodeType:
          type: string
        actionType:
          type: string
        compensationType:
          type: string
          enum: [WEBHOOK, SUB_PROCESS]
        status:
          type: string
          enum: [SUCCEEDED, COMPENSATING, COMPENSATED, DLQ]
        attempts:
          type: integer
        maxAttempts:
          type: integer
        retryBackoffMs:
          type: integer
          format: int64
        timeoutSeconds:
          type: integer
        nextAttemptAt:
          type: string
          format: date-time
          nullable: true
        lastError:
          type: string
          nullable: true
        compensatedAt:
          type: string
          format: date-time
          nullable: true

    WorkflowInstanceResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        workflowDefinitionId:
          type: string
          format: uuid
        workflowVersion:
          type: integer
        state:
          type: string
        contextJson:
          type: string
        idempotencyKey:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    ExecutionLogResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        workflowInstanceId:
          type: string
          format: uuid
        nodeId:
          type: string
          nullable: true
        nodeType:
          type: string
          nullable: true
        action:
          type: string
        payload:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    TaskResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        workflowInstanceId:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
        description:
          type: string
          nullable: true
        assigneeId:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
        version:
          type: integer
          format: int64
        decisionComment:
          type: string
          nullable: true

    FormDefinitionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        name:
          type: string
        schemaJson:
          type: string
        version:
          type: integer
        createdAt:
          type: string
          format: date-time

    FormSubmissionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        formId:
          type: string
          format: uuid
        workflowInstanceId:
          type: string
          format: uuid
          nullable: true
        dataJson:
          type: string
        submittedBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    DocumentVersionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fileId:
          type: string
          format: uuid
        version:
          type: integer
        size:
          type: integer
          format: int64
        format:
          type: string
          nullable: true
        status:
          type: string
          enum: [PENDING, AVAILABLE, ARCHIVED]
        createdAt:
          type: string
          format: date-time
        name:
          type: string
          nullable: true
          description: Display name from the quarantine record.
        scanStatus:
          type: string
          nullable: true
          description: Live antivirus lifecycle for the underlying file.
          enum: [QUARANTINED, SCANNING, CLEAN, PROMOTED, INFECTED, SCAN_FAILED]
        scanError:
          type: string
          nullable: true
          description: Last scan failure detail, when the status is SCAN_FAILED.
        downloadable:
          type: boolean
          description: True only when scanStatus is PROMOTED.

    CreateDocumentResponse:
      type: object
      properties:
        fileId:
          type: string
          format: uuid
        uploadUrl:
          type: string
          format: uri
        version:
          $ref: "#/components/schemas/DocumentVersionResponse"

    NotificationDeliveryResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        channel:
          type: string
          enum: [EMAIL, SMS, PUSH, WEB, WEBHOOK]
        recipient:
          type: string
        templateKey:
          type: string
          nullable: true
        status:
          type: string
        attempts:
          type: integer
        lastError:
          type: string
          nullable: true
        nextAttemptAt:
          type: string
          format: date-time
          nullable: true
          description: When the retry scheduler will make the next attempt (null for SENT/FAILED).
        createdAt:
          type: string
          format: date-time
        businessKey:
          type: string
          nullable: true
          description: >-
            Business identity (workflow instance, task, approval or form id) used for
            de-duplication, when the producer supplied one.
        dedupeExpiresAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            End of the active de-duplication window. A repeat after this instant creates a
            new delivery.
        read:
          type: boolean
          description: True when the notification has been acknowledged.
        readAt:
          type: string
          format: date-time
          nullable: true
          description: Acknowledgement timestamp; omitted/null while unread.

    UnreadNotificationCountResponse:
      type: object
      required: [count]
      properties:
        count:
          type: integer
          format: int64
          minimum: 0

    WebhookDeliveryResponse:
      type: object
      description: One durable webhook delivery; never contains the payload or query string.
      properties:
        id:
          type: string
          format: uuid
        workflowInstanceId:
          type: string
          format: uuid
        nodeExecutionId:
          type: string
          format: uuid
        nodeId:
          type: string
        targetUrl:
          type: string
          description: Target URL with the query string and fragment removed.
        status:
          type: string
          enum: [PENDING, RETRYING, SENT, DEAD, CANCELLED]
        attempts:
          type: integer
        maxAttempts:
          type: integer
        nextAttemptAt:
          type: string
          format: date-time
        lastStatusCode:
          type: integer
          nullable: true
        lastError:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time

    AnalyticsAggregateResponse:
      type: object
