          type: integer
          format: int64
        subject:
          type: string
        body:
          type: string
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time

    NotificationTemplatePreviewResponse:
      type: object
      required: [subject, body, placeholders]
      properties:
        subject:
          type: string
        body:
          type: string
          description: Variables are HTML-escaped.
        placeholders:
          type: array
          items:
            type: string

    CreateNotificationTemplateRequest:
      type: object
      required: [templateKey, locale, subject, body]
      properties:
        templateKey:
          type: string
          maxLength: 128
          pattern: "^[a-z0-9][a-z0-9._-]*$"
        locale:
          type: string
          pattern: "^[A-Za-z]{2}([_-][A-Za-z]{2})?$"
          description: Stored canonically as lowercase language plus uppercase region (for example en-US).
          example: tr
        subject:
          type: string
          maxLength: 512
        body:
          type: string
          description: Limited to 1 MiB; placeholders must look like {{name}}.

    UpdateNotificationTemplateRequest:
      type: object
      required: [expectedVersion, subject, body]
      properties:
        expectedVersion:
          type: integer
          format: int64
        subject:
          type: string
          maxLength: 512
        body:
          type: string

    PreviewNotificationTemplateRequest:
      type: object
      properties:
        templateKey:
          type: string
          maxLength: 128
          pattern: "^[a-z0-9][a-z0-9._-]*$"
        locale:
          type: string
          pattern: "^[A-Za-z]{2}([_-][A-Za-z]{2})?$"
          description: Canonicalized before the stored template lookup.
        subject:
          type: string
          maxLength: 512
        body:
          type: string
