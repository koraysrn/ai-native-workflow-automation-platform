# SonarQube project configuration for the AWAP backend (issue #182).
#
# Run from the `backend/` directory:
#   mvn -B test jacoco:report
#   mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar \
#     -Dsonar.host.url="$SONAR_HOST_URL" -Dsonar.token="$SONAR_TOKEN"
#
# sonar.organization is mandatory on SonarQube Cloud (it is ignored by a
# self-hosted SonarQube server) and the project key must match the project that
# is bound to this repository, otherwise the analysis is rejected. CI reads the
# key from this file, so it stays the single source of truth.
sonar.projectKey=koraysrn_ai-native-workflow-automation-platform
sonar.organization=koraysrn
sonar.projectName=AI-Native Workflow Automation Platform
sonar.projectVersion=0.0.1-SNAPSHOT

sonar.sources=common/src/main/java,identity/src/main/java
sonar.tests=common/src/test/java,identity/src/test/java
sonar.java.binaries=common/target/classes,identity/target/classes
sonar.java.test.binaries=common/target/test-classes,identity/target/test-classes
sonar.java.source=25
sonar.sourceEncoding=UTF-8

# JaCoCo XML is the only coverage input. The report check in CI fails the job
# when either file is missing or empty, so a silent coverage loss is impossible.
sonar.coverage.jacoco.xmlReportPaths=common/target/site/jacoco/jacoco.xml,identity/target/site/jacoco/jacoco.xml
sonar.junit.reportPaths=common/target/surefire-reports,identity/target/surefire-reports

sonar.exclusions=**/target/**,**/generated-sources/**,**/generated-test-sources/**,**/*MapperImpl.java
sonar.coverage.exclusions=**/interfaces/dto/**,**/config/**,**/IdentityApplication.java
sonar.cpd.exclusions=**/interfaces/dto/**,**/generated-sources/**

# Issue #182: the quality gate is a hard merge gate. A failed gate fails the
# CI job instead of producing a green check with findings.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600

# Pull-request decoration is provided by the SonarQube GitHub application. The
# CI job passes sonar.pullrequest.* on pull_request events so the analysis is
# attached to the PR instead of only to the main branch.
