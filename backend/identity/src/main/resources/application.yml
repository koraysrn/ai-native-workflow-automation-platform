spring:
  application:
    name: awap-identity
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/awap}
    username: ${DB_USER:awap}
    password: ${DB_PASSWORD:awap}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

awap:
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-in-production-0123456789abcdef}
      access-token-ttl: ${JWT_ACCESS_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TTL:7d}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.awap: DEBUG
