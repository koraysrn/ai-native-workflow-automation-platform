spring:
  application:
    name: awap-identity
  config:
    import: "optional:vault://"
  cloud:
    vault:
      enabled: ${VAULT_ENABLED:false}
      uri: ${VAULT_URI:http://localhost:8200}
      authentication: TOKEN
      token: ${VAULT_TOKEN:}
      kv:
        enabled: true
        backend: secret
        default-context: awap
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/awap}
    username: ${DB_USER:awap_app}
    password: ${DB_PASSWORD:awap_app}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    user: ${FLYWAY_USER:awap}
    password: ${FLYWAY_PASSWORD:awap}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

awap:
  kafka:
    enabled: ${KAFKA_ENABLED:false}
    # Issue #123: dual-consume the legacy awap.dlq topic for one release. Older deployments may
    # still publish there; set KAFKA_LEGACY_DLQ_ENABLED=false only after the deprecation window
    # (see docs/operations-runbook.md O7).
    legacy-dlq-enabled: ${KAFKA_LEGACY_DLQ_ENABLED:true}
    legacy-dlq-topic: ${KAFKA_LEGACY_DLQ_TOPIC:awap.dlq}
    # Anchored pattern: per-topic *.dlq only. The legacy topic is appended by the flag above, so
    # disabling the flag really stops consuming awap.dlq. Unrelated topics such as
    # not-a-dlq-topic never match.
    dlq-topic-pattern: '${KAFKA_DLQ_TOPIC_PATTERN:^(?!awap\.dlq$)[A-Za-z0-9._-]+\.dlq$}'
    dlq-group-id: ${KAFKA_DLQ_GROUP_ID:awap-dlq}
    # Bounded metric tag values. Topics not listed here are folded into "other" so a malicious
    # producer cannot create unbounded Prometheus series.
    dlq-known-topics: ${KAFKA_DLQ_KNOWN_TOPICS:workflow.task.events,workflow.instance.events,workflow.subprocess.events,analytics.events,document.events,notification.send,notification.requested.events}
    dlq-quarantine-path: ${DLQ_QUARANTINE_PATH:target/dlq-quarantine/legacy-dlq-quarantine.jsonl}
    # Bounded poll: a large DLQ backlog is drained in chunks instead of blocking the listener.
    max-poll-records: ${KAFKA_MAX_POLL_RECORDS:50}
  outbox:
    retention-days: ${OUTBOX_RETENTION_DAYS:7}
    archive-path: ${OUTBOX_ARCHIVE_PATH:target/outbox-archive/outbox.jsonl}
    batch-size: ${OUTBOX_BATCH_SIZE:100}
    datasource:
      enabled: ${OUTBOX_SEPARATE_POOL:true}
      maximum-pool-size: ${OUTBOX_POOL_SIZE:4}
  notification:
    retention-days: ${NOTIFICATION_RETENTION_DAYS:30}
    retry-delays-ms: ${NOTIFICATION_RETRY_DELAYS_MS:1000,5000,25000}
  analytics:
    opensearch:
      enabled: ${OPENSEARCH_ENABLED:false}
      endpoint: ${OPENSEARCH_ENDPOINT:http://localhost:9200}
      index: ${OPENSEARCH_ANALYTICS_INDEX:awap-analytics}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:false}
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-ttl: ${JWT_ACCESS_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TTL:7d}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
    cookie-secure: ${COOKIE_SECURE:false}
    cookie-same-site: ${COOKIE_SAME_SITE:Lax}
  webhook:
    secret: ${WEBHOOK_SECRET:}
    allowed-hosts: ${WEBHOOK_ALLOWED_HOSTS:}
    max-timestamp-skew-ms: ${WEBHOOK_MAX_TIMESTAMP_SKEW_MS:300000}
  clamav:
    enabled: ${CLAMAV_ENABLED:false}
    host: ${CLAMAV_HOST:localhost}
    port: ${CLAMAV_PORT:3310}
    timeout-ms: ${CLAMAV_TIMEOUT_MS:10000}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:awapadmin}
    secret-key: ${MINIO_SECRET_KEY:awapadmin123}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,httpexchanges
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  level:
    root: INFO
    com.awap: DEBUG
