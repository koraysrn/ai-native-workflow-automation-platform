spring:
  application:
    name: awap-identity
  config:
    import: "optional:vault://"
  cloud:
    vault:
      enabled: ${VAULT_ENABLED:false}
      uri: ${VAULT_URI:http://localhost:8200}
      authentication: TOKEN
      token: ${VAULT_TOKEN:}
      kv:
        enabled: true
        backend: secret
        default-context: awap
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/awap}
    username: ${DB_USER:awap_app}
    password: ${DB_PASSWORD:awap_app}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    user: ${FLYWAY_USER:awap}
    password: ${FLYWAY_PASSWORD:awap}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # Idempotent producer (issue #121): a republish after a relay crash must not duplicate the
      # event on the broker. `acks=all` + retries also make a send only "successful" once every
      # in-sync replica has the record, which is what the relay's published_at now asserts.
      acks: ${KAFKA_PRODUCER_ACKS:all}
      retries: ${KAFKA_PRODUCER_RETRIES:2147483647}
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: ${KAFKA_PRODUCER_IDEMPOTENCE:true}
        max.in.flight.requests.per.connection: ${KAFKA_PRODUCER_MAX_IN_FLIGHT:5}
        delivery.timeout.ms: ${KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS:30000}

awap:
  kafka:
    enabled: ${KAFKA_ENABLED:false}
  outbox:
    retention-days: ${OUTBOX_RETENTION_DAYS:7}
    archive-path: ${OUTBOX_ARCHIVE_PATH:target/outbox-archive/outbox.jsonl}
    batch-size: ${OUTBOX_BATCH_SIZE:100}
    # Claim lease (issue #121): must stay longer than the relay's 10s Kafka send timeout so a row
    # that is still being sent can never be claimed by a second relay.
    claim-lease: ${OUTBOX_CLAIM_LEASE:60s}
    # Rows that fail this many publishes are quarantined and reported instead of retried forever.
    max-publish-attempts: ${OUTBOX_MAX_PUBLISH_ATTEMPTS:5}
    relay-interval-ms: ${OUTBOX_RELAY_INTERVAL_MS:5000}
    relay-initial-delay-ms: ${OUTBOX_RELAY_INITIAL_DELAY_MS:5000}
    reconciliation:
      interval-ms: ${OUTBOX_RECONCILIATION_INTERVAL_MS:60000}
      batch-size: ${OUTBOX_RECONCILIATION_BATCH_SIZE:1000}
    datasource:
      enabled: ${OUTBOX_SEPARATE_POOL:true}
      maximum-pool-size: ${OUTBOX_POOL_SIZE:4}
  notification:
    retention-days: ${NOTIFICATION_RETENTION_DAYS:30}
    retry-delays-ms: ${NOTIFICATION_RETRY_DELAYS_MS:1000,5000,25000}
  analytics:
    opensearch:
      enabled: ${OPENSEARCH_ENABLED:false}
      endpoint: ${OPENSEARCH_ENDPOINT:http://localhost:9200}
      index: ${OPENSEARCH_ANALYTICS_INDEX:awap-analytics}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:false}
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-ttl: ${JWT_ACCESS_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TTL:7d}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
    cookie-secure: ${COOKIE_SECURE:false}
    cookie-same-site: ${COOKIE_SAME_SITE:Lax}
  webhook:
    secret: ${WEBHOOK_SECRET:}
    allowed-hosts: ${WEBHOOK_ALLOWED_HOSTS:}
    max-timestamp-skew-ms: ${WEBHOOK_MAX_TIMESTAMP_SKEW_MS:300000}
  clamav:
    enabled: ${CLAMAV_ENABLED:false}
    host: ${CLAMAV_HOST:localhost}
    port: ${CLAMAV_PORT:3310}
    timeout-ms: ${CLAMAV_TIMEOUT_MS:10000}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:awapadmin}
    secret-key: ${MINIO_SECRET_KEY:awapadmin123}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,httpexchanges
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  level:
    root: INFO
    com.awap: DEBUG
