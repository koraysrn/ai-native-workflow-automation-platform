spring:
  application:
    name: awap-identity
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/awap}
    username: ${DB_USER:awap_app}
    password: ${DB_PASSWORD:awap_app}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    user: ${FLYWAY_USER:awap}
    password: ${FLYWAY_PASSWORD:awap}

awap:
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-ttl: ${JWT_ACCESS_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TTL:7d}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  level:
    root: INFO
    com.awap: DEBUG
