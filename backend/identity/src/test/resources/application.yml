spring:
  datasource:
    url: jdbc:h2:mem:awap-test;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false
  cloud:
    vault:
      enabled: false

management:
  health:
    redis:
      enabled: false

awap:
  outbox:
    datasource:
      enabled: false
  analytics:
    opensearch:
      enabled: false
  webhook:
    retry:
      enabled: false
  kafka:
    enabled: false
  security:
    jwt:
      secret: test-secret-0123456789abcdef0123456789abcdef
      access-token-ttl: 15m
      refresh-token-ttl: 7d
