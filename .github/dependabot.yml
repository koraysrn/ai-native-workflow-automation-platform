version: 2
updates:
  # Maven, npm and Python dependency updates are handled by Renovate (renovate.json)
  # to get grouped PRs. Dependabot is retained only for GitHub Actions so that the
  # two tools do not open duplicate PRs.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
