name: Release

# Issue #179: releases are produced by release-please from Conventional Commits.
# The release PR carries the version bump and the CHANGELOG entry and is reviewed
# and tested like any other pull request. A tag is created only after the merged
# release PR has produced a green full CI run on `main`.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      from:
        description: "First ref for the dry run (default: last v* tag or bootstrap-sha)"
        required: false
        type: string
      to:
        description: "Last ref for the dry run (default: HEAD)"
        required: false
        type: string

# Serialize releases: two merged PRs must never race on the release PR/version.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  dry-run:
    name: Release Dry Run
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Print the next version and changelog entries
        env:
          FROM_REF: ${{ inputs.from }}
          TO_REF: ${{ inputs.to }}
        run: >-
          node scripts/release/dry-run.mjs --dry-run
          --from "$FROM_REF"
          --to "$TO_REF"

  release:
    name: Release Please
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout the CI-verified commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Verify the CI gate for this commit
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_EVENT: ${{ github.event.workflow_run.event }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          node scripts/release/verify-ci-gate.mjs \
            --event "$EVENT_NAME" \
            --conclusion "$CONCLUSION" \
            --workflow-name "$WORKFLOW_NAME" \
            --workflow-event "$WORKFLOW_EVENT" \
            --branch "$BRANCH" \
            --sha "$SHA" \
            --main-sha "$(git rev-parse origin/main)" \
            --github-output "$GITHUB_OUTPUT"

      # Issue #179: prefer a GitHub App installation token. The app credentials
      # are the dedicated bot identity recommended by the runbook; the
      # RELEASE_PLEASE_TOKEN secret remains supported as a fallback. The
      # detection step is needed because the secrets context is not available in
      # a step-level `if` expression.
      - name: Detect GitHub App credentials
        id: app-credentials
        if: steps.gate.outputs.skip != 'true'
        env:
          APP_ID: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          PRIVATE_KEY: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$PRIVATE_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint a release token from the GitHub App
        id: app-token
        if: steps.gate.outputs.skip != 'true' && steps.app-credentials.outputs.configured == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-actions: write

      - name: Resolve and verify the release token
        id: token
        if: steps.gate.outputs.skip != 'true'
        env:
          # A bot token is mandatory: release PRs opened with GITHUB_TOKEN do not
          # trigger CI and could never satisfy the required checks.
          RELEASE_PLEASE_TOKEN: ${{ steps.app-token.outputs.token || secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_TOKEN_SOURCE: ${{ steps.app-token.outputs.token != '' && 'github-app' || 'token' }}
        run: >-
          node scripts/release/token-preflight.mjs
          --repo "$GITHUB_REPOSITORY"
          --github-output "$GITHUB_OUTPUT"

      - name: Open or update the release PR
        id: release
        if: steps.gate.outputs.skip != 'true'
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Dispatch CD explicitly so the CD pipeline runs for the released tag even
      # when the repository restricts workflows triggered by bot tags. The
      # dispatch is guarded by release_created, so a duplicate run cannot trigger
      # CD twice.
      - name: Trigger CD for the released tag
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run cd.yml --ref main -f tag="$TAG_NAME"
