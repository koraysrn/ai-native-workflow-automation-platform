name: Chaos Recovery

on:
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    # Nightly fault-injection run in addition to PR runs (issue #211).
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chaos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chaos:
    name: Fault Injection
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Fault-injection and recovery suite
        # The "chaos" tag is excluded from the normal suite; this profile selects only it.
        # Testcontainers covers real PostgreSQL and Kafka restarts.
        run: mvn -B -Pchaos test
        working-directory: backend
      - name: Upload failure artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: chaos-surefire-reports
          path: |
            backend/identity/target/surefire-reports
            backend/identity/target/*.dump*
          retention-days: 14
          if-no-files-found: warn
