name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  packages: write
  security-events: write

# One CI run per ref: a new push cancels the superseded run so parallel runs do
# not compete for the same NVD API key quota during the OWASP cold download.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 25 / Spring Boot 4.1.1)
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Download consumer Pact
        uses: actions/download-artifact@v6
        with:
          name: pact
          path: backend/identity/src/test/resources/pacts
      - name: Build and test (includes Pact provider verification)
        run: mvn -B verify
        working-directory: backend
      - name: Format check (Spotless)
        run: mvn -B spotless:check
        working-directory: backend
      - name: Check Jackson BOM override floor
        run: ./scripts/check-jackson-versions.sh
        working-directory: backend
      - name: Generate SBOM
        run: mvn -B org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom
        working-directory: backend
      - name: Upload SBOM
        uses: actions/upload-artifact@v6
        with:
          name: sbom-backend
          path: backend/target/bom.json
      - name: Mutation testing (PIT)
        run: mvn -B -Ppit verify
        working-directory: backend
      - name: Upload PIT report
        uses: actions/upload-artifact@v6
        with:
          name: pit-report
          path: backend/identity/target/pit-reports

  owasp:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Cache NVD database
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ runner.os }}-${{ hashFiles('backend/pom.xml') }}
          restore-keys: |
            nvd-${{ runner.os }}-
      - name: Dependency scan (OWASP)
        timeout-minutes: 60
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::error::NVD_API_KEY secret is required to run OWASP Dependency Check."
            exit 1
          fi
          mvn -B -DskipTests install
          DATA_DIR="$HOME/.m2/repository/org/owasp/dependency-check-data"
          if [ -d "$DATA_DIR" ] && [ -n "$(ls -A "$DATA_DIR" 2>/dev/null)" ]; then
            echo "NVD cache present; running offline scan (autoUpdate=false)."
            mvn -B -Dnvd.api.key="$NVD_API_KEY" -DautoUpdate=false org.owasp:dependency-check-maven:check
          else
            echo "NVD cache missing; running a full NVD update."
            mvn -B -Dnvd.api.key="$NVD_API_KEY" -Dnvd.api.delay=8000 org.owasp:dependency-check-maven:check
          fi
        working-directory: backend

  frontend:
    name: Frontend (TypeScript 7.x / Next.js 16)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Generate consumer contract (Pact)
        run: pnpm pact:generate
        working-directory: frontend
      - name: Upload pact artifact
        uses: actions/upload-artifact@v6
        with:
          name: pact
          path: frontend/pacts/*.json
      - name: Unit tests (Jest)
        run: pnpm exec jest --runInBand
        working-directory: frontend
      - name: Type check
        run: pnpm typecheck
        working-directory: frontend
      - name: Build
        run: pnpm build
        working-directory: frontend
      - name: Lint
        run: pnpm lint
        working-directory: frontend
      - name: E2E accessibility tests (axe)
        run: pnpm exec playwright install chromium && pnpm test:e2e
        working-directory: frontend

  ai-layer:
    name: AI Layer (Python 3.15 / FastAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Sync dependencies (locked)
        run: uv sync --locked
        working-directory: ai-layer
      - name: Lint (Ruff)
        run: uv run ruff check .
        working-directory: ai-layer
      - name: Format check (Ruff)
        run: uv run ruff format --check .
        working-directory: ai-layer
      - name: Pilot compatibility check
        run: uv run python compat_check.py
        working-directory: ai-layer

  trivy:
    name: Trivy vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan filesystem
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1

  gitleaks:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sonarqube:
    name: SonarQube analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - name: SonarQube scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if [ -z "$SONAR_TOKEN" ] || [ -z "$SONAR_HOST_URL" ]; then
            echo "SonarQube secrets are not configured; skipping analysis (set SONAR_TOKEN and SONAR_HOST_URL to enable)."
            exit 0
          fi
          mvn -B sonar:sonar -Dsonar.projectKey=awap -Dsonar.host.url="$SONAR_HOST_URL"
        working-directory: backend

  docker-build:
    name: Docker build (backend, frontend, ai-layer)
    uses: ./.github/workflows/docker-build.yml
    with:
      push: false
      tag-suffix: ci
    permissions:
      contents: read
      packages: write

  openapi:
    name: OpenAPI lint (Spectral)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Lint OpenAPI spec
        run: npx --yes @stoplight/spectral-cli@6.14.3 lint docs/openapi/awap-openapi.yaml --fail-severity warn

  pact-gate:
    name: Pact broker can-i-deploy
    runs-on: ubuntu-latest
    needs: backend
    # Activates once a Pact Broker is configured (PACT_BROKER_BASE_URL repository variable
    # and PACT_BROKER_TOKEN secret). Without a broker the file-based provider verification in
    # the backend job remains the merge gate.
    if: ${{ vars.PACT_BROKER_BASE_URL != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Download consumer Pact
        uses: actions/download-artifact@v6
        with:
          name: pact
          path: frontend/pacts
      - name: Publish consumer Pact
        env:
          PACT_BROKER_BASE_URL: ${{ vars.PACT_BROKER_BASE_URL }}
          PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
        run: |
          npx --yes @pact-foundation/pact-cli@latest \
            broker publish frontend/pacts \
            --consumer-app-version "${GITHUB_SHA}" --branch "${GITHUB_REF_NAME}"
      - name: can-i-deploy
        env:
          PACT_BROKER_BASE_URL: ${{ vars.PACT_BROKER_BASE_URL }}
          PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
        run: |
          npx --yes @pact-foundation/pact-cli@latest \
            broker can-i-deploy \
            --pacticipant awap-frontend --version "${GITHUB_SHA}" --to-environment production
