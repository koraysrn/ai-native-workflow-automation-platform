name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  backend:
    name: Backend (Java 25 / Spring Boot 4.1.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build and test
        run: mvn -B verify
        working-directory: backend
      - name: Format check (Spotless)
        run: mvn -B spotless:check
        working-directory: backend
      - name: Dependency scan (OWASP)
        run: mvn -B org.owasp:dependency-check-maven:check
        working-directory: backend
      - name: Generate SBOM
        run: mvn -B org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom
        working-directory: backend
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-backend
          path: backend/target/bom.json

  frontend:
    name: Frontend (TypeScript 7.0.2 / Next.js 16)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck
        working-directory: frontend
      - name: Build
        run: pnpm build
        working-directory: frontend

  ai-layer:
    name: AI Layer (Python 3.15 / FastAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: awap-ai
      - name: Lint (Ruff)
        shell: bash -el {0}
        run: ruff check .
        working-directory: ai-layer

  trivy:
    name: Trivy vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan filesystem
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1
