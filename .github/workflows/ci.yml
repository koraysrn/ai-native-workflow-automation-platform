name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  # Nightly full-stack E2E run in addition to PR runs (issue #128).
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read
  packages: write
  security-events: write

# One CI run per ref: a new push cancels the superseded run so parallel runs do
# not compete for the same NVD API key quota during the OWASP cold download.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Download consumer Pact
        uses: actions/download-artifact@v8
        with:
          name: pact
          path: backend/identity/src/test/resources/pacts
      - name: Build and test (includes Pact provider verification)
        run: mvn -B verify
        working-directory: backend
      - name: Module dependency graph check
        # Issue #181: fail on a new backend module cycle and on stale baseline entries.
        run: |
          node --test "scripts/test/module-dependency-graph.test.mjs"
          node scripts/module-dependency-graph.mjs --check
      - name: JaCoCo report guard tests
        # Issue #182: an empty coverage report must fail instead of suppressing
        # SonarQube's coverage signal.
        run: node --test "scripts/test/check-jacoco-report.test.mjs"
      - name: Format check (Spotless)
        run: mvn -B spotless:check
        working-directory: backend
      - name: Check Jackson BOM override floor
        run: ./scripts/check-jackson-versions.sh
        working-directory: backend
      - name: Generate SBOM
        run: mvn -B org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom
        working-directory: backend
      - name: Upload SBOM
        uses: actions/upload-artifact@v6
        with:
          name: sbom-backend
          path: backend/target/bom.json
      - name: Mutation testing (PIT >= 80%)
        run: mvn -B -Ppit test-compile org.pitest:pitest-maven:mutationCoverage
        working-directory: backend
      - name: Template mutation testing (PIT >= 85%)
        run: mvn -B -Ppit-notification test-compile org.pitest:pitest-maven:mutationCoverage
        working-directory: backend
      - name: Notification read mutation testing (PIT >= 85%)
        run: mvn -B -Ppit-notification-read test-compile org.pitest:pitest-maven:mutationCoverage
        working-directory: backend
      - name: Saga mutation testing (PIT >= 85%)
        run: mvn -B -Ppit-saga test-compile org.pitest:pitest-maven:mutationCoverage
        working-directory: backend
      - name: Upload PIT reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pit-report
          path: |
            backend/identity/target/pit-reports
            backend/identity/target/pit-reports-notification-read

  owasp:
    name: Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Cache NVD database
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ runner.os }}-${{ hashFiles('backend/pom.xml') }}
          restore-keys: |
            nvd-${{ runner.os }}-
      - name: Dependency scan (OWASP)
        timeout-minutes: 60
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::error::NVD_API_KEY secret is required to run OWASP Dependency Check."
            exit 1
          fi
          mvn -B -DskipTests install
          DATA_DIR="$HOME/.m2/repository/org/owasp/dependency-check-data"
          if [ -d "$DATA_DIR" ] && [ -n "$(ls -A "$DATA_DIR" 2>/dev/null)" ]; then
            echo "NVD cache present; running offline scan (autoUpdate=false)."
            mvn -B -Dnvd.api.key="$NVD_API_KEY" -DautoUpdate=false org.owasp:dependency-check-maven:check
          else
            echo "NVD cache missing; running a full NVD update."
            mvn -B -Dnvd.api.key="$NVD_API_KEY" -Dnvd.api.delay=8000 org.owasp:dependency-check-maven:check
          fi
        working-directory: backend

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Generate consumer contract (Pact)
        run: pnpm pact:generate
        working-directory: frontend
      - name: Upload pact artifact
        uses: actions/upload-artifact@v6
        with:
          name: pact
          path: frontend/pacts/*.json
      - name: Unit tests (Jest)
        run: pnpm exec jest --runInBand
        working-directory: frontend
      - name: Type check
        run: pnpm typecheck
        working-directory: frontend
      - name: Build
        run: pnpm build
        working-directory: frontend
      - name: Lint
        run: pnpm lint
        working-directory: frontend
      # The browser suite runs in the dedicated `e2e` job against the Compose stack.

  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Resolve Playwright version
        id: playwright-version
        working-directory: frontend
        run: |
          VERSION=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - name: Start Compose stack
        env:
          # The live journey asserts real analytics aggregates and a real document scan
          # projection. Kafka must be enabled for the outbox relay to reach the analytics
          # listener, and MinIO stays opt-in (the API records QUARANTINED without buckets).
          KAFKA_ENABLED: "true"
          FILE_MANAGE_BUCKETS: "false"
          FILE_SCAN_INTERVAL_MS: "3600000"
          OUTBOX_RELAY_INTERVAL_MS: "1000"
          OUTBOX_RELAY_INITIAL_DELAY_MS: "1000"
        run: docker compose -f infra/docker-compose.yml up -d --build
      - name: Wait for backend health
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health >/dev/null; then
              echo "Backend healthy after $attempt attempt(s)."
              exit 0
            fi
            sleep 5
          done
          docker compose -f infra/docker-compose.yml logs --tail=200 backend
          exit 1
      - name: Wait for frontend
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:3000 >/dev/null; then
              echo "Frontend ready after $attempt attempt(s)."
              exit 0
            fi
            sleep 5
          done
          docker compose -f infra/docker-compose.yml logs --tail=200 frontend
          exit 1
      - name: Run Playwright suite
        working-directory: frontend
        env:
          CI: "true"
          E2E_EXTERNAL_STACK: "1"
          E2E_LIVE_STACK: "1"
          E2E_BASE_URL: http://localhost:3000
          E2E_API_URL: http://localhost:8080
          E2E_SEED_SUFFIX: ${{ github.run_id }}-${{ github.run_attempt }}
        run: pnpm exec playwright test --workers=1
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 14
      - name: Upload accessibility report
        # Issue #184: every axe scan is persisted even when a screen fails.
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: a11y-report
          path: frontend/a11y-report
          retention-days: 14
          if-no-files-found: warn
      - name: Upload traces, screenshots and videos
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-failures
          path: frontend/test-results
          retention-days: 14
      - name: Dump Compose logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --tail=2000 backend kafka
      - name: Stop Compose stack
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v

  ai-layer:
    name: AI Layer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Sync dependencies (locked)
        run: uv sync --locked
        working-directory: ai-layer
      - name: Lint (Ruff)
        run: uv run ruff check .
        working-directory: ai-layer
      - name: Format check (Ruff)
        run: uv run ruff format --check .
        working-directory: ai-layer
      - name: Pilot compatibility check
        run: uv run python compat_check.py
        working-directory: ai-layer
      - name: Health contract tests
        # Issue #185: documented paths, status/body and version must match the app.
        run: uv run pytest
        working-directory: ai-layer

  trivy:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    # Issue #162: the CI job is the Trivy regression signal (decision recorded in ADR-0005).
    # `actions: read` is needed to count consecutive failing runs; `issues: write` opens the
    # repeated-failure tracking issue. The scan step itself only reads the repository.
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Scan filesystem (JSON)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy-results.json
          # The report step owns the gate so it can emit the summary/annotations first.
          exit-code: 0
      - name: Report results and enforce the gate
        run: >-
          node scripts/trivy-regression-report.mjs
          --input trivy-results.json
          --fail-on CRITICAL,HIGH
      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: trivy-report
          path: trivy-results.json
          retention-days: 30
          if-no-files-found: ignore
      - name: Open or update the repeated-failure issue
        # PR failures are already attached to the pull request; escalation is for `main` only.
        if: failure() && github.ref == 'refs/heads/main'
        # The gate already made the job red; a GitHub API hiccup must not hide the real cause.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: >-
          node scripts/trivy-regression-notify.mjs
          --mode failure
          --report trivy-results.json
          --streak-threshold 2
      - name: Close the repeated-failure issue after recovery
        if: success() && github.ref == 'refs/heads/main'
        # A cleanup/API failure must not turn a green Trivy scan into a red build.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: node scripts/trivy-regression-notify.mjs --mode success

  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sonarqube:
    name: Code Quality
    runs-on: ubuntu-latest
    # Issue #182: this is a required check. Missing secrets, a missing coverage
    # report or a failed quality gate must fail the PR, never silently skip.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_BOOTSTRAP: ${{ vars.SONAR_BOOTSTRAP }}
      SONAR_PROJECT_KEY: awap
      SONAR_MAVEN_PLUGIN_VERSION: 5.8.0.7211
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require SonarQube secrets
        run: |
          if [ -z "$SONAR_TOKEN" ] || [ -z "$SONAR_HOST_URL" ]; then
            if [ "$SONAR_BOOTSTRAP" = "true" ]; then
              echo "::warning title=SonarQube bootstrap::SONAR_TOKEN/SONAR_HOST_URL are not configured. Analysis is skipped ONLY because the maintainer-only SONAR_BOOTSTRAP repository variable is true. Remove that variable as soon as the secrets exist."
              echo "SONAR_SKIP=true" >> "$GITHUB_ENV"
              exit 0
            fi
            missing=0
            if [ -z "$SONAR_TOKEN" ]; then
              echo "::error title=SonarQube::SONAR_TOKEN is required. Add the repository secret before merging."
              missing=1
            fi
            if [ -z "$SONAR_HOST_URL" ]; then
              echo "::error title=SonarQube::SONAR_HOST_URL is required (for example https://sonarcloud.io)."
              missing=1
            fi
            echo "See docs/sonarqube.md for bootstrap and local-scanner instructions."
            exit "$missing"
          fi
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Cache SonarQube scanner
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}-${{ env.SONAR_MAVEN_PLUGIN_VERSION }}
      - name: Test and generate JaCoCo coverage
        if: env.SONAR_SKIP != 'true'
        run: mvn -B -pl identity -am test jacoco:report
        working-directory: backend
      - name: Verify coverage reports are present and non-empty
        if: env.SONAR_SKIP != 'true'
        run: node scripts/check-jacoco-report.mjs backend/identity/target/site/jacoco/jacoco.xml
      - name: SonarQube analysis with blocking quality gate
        if: env.SONAR_SKIP != 'true'
        working-directory: backend
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          EXTRA=()
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            EXTRA+=("-Dsonar.pullrequest.key=$PR_NUMBER")
            EXTRA+=("-Dsonar.pullrequest.base=$PR_BASE")
            EXTRA+=("-Dsonar.pullrequest.branch=$PR_BRANCH")
            EXTRA+=("-Dsonar.scm.revision=$GITHUB_SHA")
          fi
          mvn -B "org.sonarsource.scanner.maven:sonar-maven-plugin:${SONAR_MAVEN_PLUGIN_VERSION}:sonar" \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.qualitygate.wait=true \
            "${EXTRA[@]}"
      - name: Publish the quality-gate link
        if: always() && env.SONAR_SKIP != 'true'
        run: |
          echo "::notice title=SonarQube quality gate::${SONAR_HOST_URL}/dashboard?id=${SONAR_PROJECT_KEY}"

  docker-build:
    name: Docker Build
    uses: ./.github/workflows/docker-build.yml
    with:
      push: false
      tag-suffix: ci
    permissions:
      contents: read
      packages: write

  openapi:
    name: API Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Lint OpenAPI spec
        run: npx --yes @stoplight/spectral-cli@6.14.3 lint docs/openapi/awap-openapi.yaml --fail-severity warn

  observability-static:
    name: Observability Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # The release suite needs a full history checkout and the root commitlint
      # install, so it runs in the dedicated `release` job instead of here.
      - name: Trivy and branch-protection tooling tests
        run: >-
          node --test
          "scripts/test/trivy-regression-*.test.mjs"
          "scripts/test/apply-branch-protection.test.mjs"
      - name: Dashboard and alert rule tests
        run: node --test "infra/grafana/test/*.test.mjs" "infra/prometheus/test/*.test.mjs"
      - name: Documentation link tests
        # Issue #185: every relative Markdown link and anchor must resolve.
        run: node --test "scripts/test/check-doc-links.test.mjs"
      - name: Documentation link check
        run: node scripts/check-doc-links.mjs
      - name: Validate Prometheus rules
        run: |
          docker run --rm -v "$PWD/infra/prometheus:/etc/prometheus" \
            --entrypoint promtool prom/prometheus:v2.55.0 \
            check rules /etc/prometheus/alert-rules.yml
      # Issue #160: prove the new alerts fire for representative values instead of only
      # checking that the YAML parses.
      - name: Test alert rules fire (promtool test rules)
        run: |
          docker run --rm -v "$PWD/infra/prometheus:/etc/prometheus" \
            --entrypoint promtool prom/prometheus:v2.55.0 \
            test rules /etc/prometheus/test/alert-rules.test.yml
      # Issue #160: execute every panel query against a real Prometheus fed by the
      # synthetic exporter, and assert the explicit empty (sentinel) case.
      - name: Validate dashboard queries against a live Prometheus
        timeout-minutes: 10
        run: node infra/prometheus/validate-live-queries.mjs

  k8s-overlays:
    name: Kubernetes Overlays
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install root tooling (yaml)
        run: pnpm install --frozen-lockfile
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0
      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin kubeconform
          kubeconform -v
      - name: Overlay validation tests
        run: node --test "infra/k8s/scripts/test/*.test.mjs"
      - name: Render and validate every overlay
        run: node infra/k8s/scripts/validate-overlays.mjs --kubeconform
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: awap-overlays
      - name: Kind server-side dry run for every overlay
        run: node infra/k8s/scripts/validate-overlays.mjs --kind

  branch-protection:
    name: Branch Protection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Shell syntax check
        run: |
          bash -n scripts/apply-branch-protection.sh
          bash -n scripts/apply-repo-governance.sh
      - name: ShellCheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y shellcheck
          fi
          shellcheck scripts/apply-branch-protection.sh scripts/apply-repo-governance.sh
      # Issue #178: the suite executes every mode and error path and fails when
      # BRANCH_PROTECTION_TRACE_FILE is missing any path declared by the script.
      - name: Policy, drift and every script path are tested
        run: node --test "scripts/test/apply-branch-protection.test.mjs"
      - name: Dry run (prints the planned API calls, changes nothing)
        run: scripts/apply-branch-protection.sh --dry-run --repo "$GITHUB_REPOSITORY"
      # Issue #180: labels, milestones and the merge policy have the same
      # every-path coverage gate, and the repository governance dry run proves
      # the desired-state file is valid without touching GitHub.
      - name: Repository governance and every script path are tested
        run: node --test "scripts/test/apply-repo-governance.test.mjs"
      - name: Repository governance dry run (changes nothing)
        run: scripts/apply-repo-governance.sh --dry-run --repo "$GITHUB_REPOSITORY"

  release:
    name: Release Checks
    runs-on: ubuntu-latest
    # Issue #179: the node:test suite executes every release-tooling branch and
    # error path, commitlint lints the whole push/PR range, the changelog guard
    # keeps CHANGELOG.md bot-owned and the dry run prints the next version.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install root tooling (commitlint)
        run: pnpm install --frozen-lockfile
      - name: Release tooling contract tests
        env:
          RELEASE_TESTS_REQUIRE_COMMITLINT: "1"
        run: node --test "scripts/test/release-*.test.mjs"
      - name: Conventional Commit lint for every commit entering main
        if: github.event_name != 'schedule'
        env:
          FROM_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          TO_SHA: ${{ github.sha }}
        run: |
          node scripts/release/lint-commits.mjs --from "$FROM_SHA" --to "$TO_SHA"
      # Squash merge turns the PR title into the main commit message, so the
      # title must satisfy commitlint before it can enter main.
      - name: Conventional Commit lint for the squash-merge PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/release/lint-commits.mjs --message "$PR_TITLE"
      - name: CHANGELOG is generated only by release-please
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[].filename' > changed-files.txt
          node scripts/release/changelog-guard.mjs \
            --event pull_request \
            --actor "$ACTOR" \
            --branch "$HEAD_REF" \
            --changed-files-file changed-files.txt
      - name: Release dry run (prints the next version and changelog entries)
        run: node scripts/release/dry-run.mjs --dry-run

  cdc-deployment:
    name: CDC Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Connector, trigger, topic and e2e-helper tests
        run: >-
          node --test "infra/debezium/test/*.test.mjs"
          "load-test/test/cdc-triggers.test.mjs"
          "load-test/test/cdc-e2e.test.mjs"
      - name: Validate CDC alert rules
        run: |
          docker run --rm -v "$PWD/infra/prometheus:/etc/prometheus" \
            --entrypoint promtool prom/prometheus:v2.55.0 \
            check rules /etc/prometheus/cdc-alert-rules.yml
      # Issue #161: prove the inactive-slot and 512 MiB slot-lag thresholds actually fire.
      - name: Test CDC alert rules fire (promtool test rules)
        run: |
          docker run --rm -v "$PWD/infra/prometheus:/etc/prometheus" \
            --entrypoint promtool prom/prometheus:v2.55.0 \
            test rules /etc/prometheus/test/cdc-alert-rules.test.yml
      - name: Validate the Compose and Kubernetes manifests
        run: |
          python3 -c "import yaml,sys; yaml.safe_load_all(open('infra/docker-compose.cdc.yml')); list(yaml.safe_load_all(open('infra/k8s/debezium-connect.yaml'))); print('manifests OK')"

  load-test-static:
    name: Load Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Scenario, retry-model and CDC trigger tests
        run: >-
          node --test "load-test/test/*.test.mjs"
      - name: Validate the k6 script bundles
        run: >-
          npx --yes esbuild@0.25.0 load-test/k6/awap-load-test.js
          --bundle --external:k6 --external:k6/*
          --outfile=load-test/k6/dist/awap-load-test.bundle.js
      - name: Remove the bundle
        if: always()
        run: rm -rf load-test/k6/dist

  pact-gate:
    name: Contract Verification
    runs-on: ubuntu-latest
    needs: backend
    # Activates once a Pact Broker is configured (PACT_BROKER_BASE_URL repository variable
    # and PACT_BROKER_TOKEN secret). Without a broker the file-based provider verification in
    # the backend job remains the merge gate.
    if: ${{ vars.PACT_BROKER_BASE_URL != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Download consumer Pact
        uses: actions/download-artifact@v8
        with:
          name: pact
          path: frontend/pacts
      - name: Publish consumer Pact
        env:
          PACT_BROKER_BASE_URL: ${{ vars.PACT_BROKER_BASE_URL }}
          PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
        run: |
          npx --yes @pact-foundation/pact-cli@latest \
            broker publish frontend/pacts \
            --consumer-app-version "${GITHUB_SHA}" --branch "${GITHUB_REF_NAME}"
      - name: can-i-deploy
        env:
          PACT_BROKER_BASE_URL: ${{ vars.PACT_BROKER_BASE_URL }}
          PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
        run: |
          npx --yes @pact-foundation/pact-cli@latest \
            broker can-i-deploy \
            --pacticipant awap-frontend --version "${GITHUB_SHA}" --to-environment production
