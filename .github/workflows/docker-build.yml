name: Docker build

on:
  workflow_call:
    inputs:
      push:
        description: "Whether to push the built images to the registry"
        type: boolean
        required: false
        default: false
      tag-suffix:
        description: "Image tag suffix (e.g. ci or a release git tag)"
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: awap-backend
            dockerfile: backend/Dockerfile
          - name: awap-frontend
            dockerfile: frontend/Dockerfile
          - name: awap-ai-layer
            dockerfile: ai-layer/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v6
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ matrix.name }}-${{ hashFiles(matrix.dockerfile) }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ matrix.name }}-

      - name: Login to registry
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ inputs.push }}
          tags: ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ inputs.tag-suffix }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Promote cache
        if: ${{ !cancelled() }}
        run: |
          rm -rf /tmp/.buildx-cache
          if [ -d /tmp/.buildx-cache-new ]; then
            mv /tmp/.buildx-cache-new /tmp/.buildx-cache
          fi
