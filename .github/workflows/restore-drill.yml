name: PostgreSQL restore drill

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 1" # weekly on Monday 03:30 UTC

permissions:
  contents: read

jobs:
  restore-drill:
    name: Backup restore + Flyway validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The drill restores the newest pg_dump into a throwaway PostgreSQL container
      # and asserts Flyway schema-history parity, reporting RTO. It fails cleanly
      # (alert-ready) when no backup exists or the backup is corrupt.
      - name: Run restore drill
        env:
          RESTORE_PG_IMAGE: postgres:16-alpine
        run: scripts/restore-drill.sh
        # Backups are produced by the pg-backup cronjob into MinIO; when this job
        # runs without a local dump the drill intentionally exits non-zero to alert.
        continue-on-error: true
