name: CD

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and push images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: awap-backend
            dockerfile: backend/Dockerfile
          - name: awap-frontend
            dockerfile: frontend/Dockerfile
          - name: awap-ai-layer
            dockerfile: ai-layer/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ github.ref_name }}

  argocd-sync:
    name: Trigger ArgoCD sync (staging)
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - run: echo "ArgoCD sync is performed by the GitOps controller when manifests change."
