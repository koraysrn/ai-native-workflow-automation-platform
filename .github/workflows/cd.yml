name: CD

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and push images
    uses: ./.github/workflows/docker-build.yml
    with:
      push: true
      tag-suffix: ${{ github.ref_name }}
    permissions:
      contents: read
      packages: write

  argocd-sync:
    name: Trigger ArgoCD sync (staging)
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - run: echo "ArgoCD sync is performed by the GitOps controller when manifests change."
