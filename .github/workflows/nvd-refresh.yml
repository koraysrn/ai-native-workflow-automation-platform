name: NVD cache refresh

on:
  schedule:
    # Weekly, Monday 03:00 UTC
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    name: Refresh NVD database cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Restore NVD database cache
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ runner.os }}-${{ hashFiles('backend/pom.xml') }}
          restore-keys: |
            nvd-${{ runner.os }}-
      - name: Full NVD update
        timeout-minutes: 60
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "NVD_API_KEY not configured; cannot refresh the NVD cache."
            exit 1
          fi
          mvn -B -DskipTests install
          mvn -B -Dnvd.api.key="$NVD_API_KEY" -Dnvd.api.delay=8000 org.owasp:dependency-check-maven:check
        working-directory: backend
