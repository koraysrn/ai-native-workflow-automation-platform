name: Nightly load test

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  load-test:
    name: Multi-tenant concurrency load test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Start the Docker Compose stack
        run: docker compose up -d --build
        working-directory: infra

      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health; then
              exit 0
            fi
            sleep 5
          done
          echo "Backend did not become healthy" && exit 1

      - name: Seed tenants
        run: node load-test/seed.mjs
        env:
          API_BASE: http://localhost:8080

      - name: Run k6 load test
        uses: grafana/k6-action@v0.3.1
        with:
          path: load-test/k6/awap-load-test.js
          cloud: false
        env:
          API_BASE: http://localhost:8080
