name: Nightly Load Test

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  # Low-VU smoke on PRs that change the load suite (issue #129).
  pull_request:
    paths:
      - "load-test/**"
      - ".github/workflows/load-test-nightly.yml"

permissions:
  contents: read

jobs:
  static:
    name: Static Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install root tooling (yaml)
        run: pnpm install --frozen-lockfile
      - name: Scenario and retry-model unit tests
        run: node --test "load-test/test/*.test.mjs"
      - name: Validate the k6 script bundles
        run: >-
          npx --yes esbuild@0.25.0 load-test/k6/awap-load-test.js
          --bundle --external:k6 --external:k6/*
          --outfile=load-test/k6/dist/awap-load-test.bundle.js
      - name: Remove the bundle
        if: always()
        run: rm -rf load-test/k6/dist

  load-test:
    name: k6 Test
    needs: static
    # The PR smoke run boots the full Compose stack; it is opt-in until the stack boot is stable
    # in CI (set the LOAD_TEST_SMOKE_ENABLED repository variable). Static checks always run.
    if: github.event_name != 'pull_request' || vars.LOAD_TEST_SMOKE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Start the Docker Compose stack
        # The load test only exercises the core stack; optional integrations stay off.
        env:
          CLAMAV_ENABLED: "false"
          AI_NODE_ENABLED: "false"
          OPENSEARCH_ENABLED: "false"
          FILE_MANAGE_BUCKETS: "false"
        run: docker compose up -d --build
        working-directory: infra

      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health; then
              exit 0
            fi
            sleep 5
          done
          echo "Backend did not become healthy" && exit 1

      - name: Start the fake webhook target
        run: |
          FAILURE_RATE=0.3 FAILURE_STATUS=500 LATENCY_MS=25 PORT=9099 \
            node load-test/fake-webhook.mjs > load-test/fake-webhook.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:9099/health; then
              exit 0
            fi
            sleep 1
          done
          cat load-test/fake-webhook.log
          exit 1

      - name: Seed tenants and export k6 variables
        run: node load-test/seed.mjs
        env:
          API_BASE: http://localhost:8080
          LOAD_TEST_SUFFIX: ${{ github.run_id }}-${{ github.run_attempt }}

      # seed.mjs writes TENANT_ID/ACCESS_TOKEN/CSRF_TOKEN to $GITHUB_ENV, which the runner exports
      # to later steps. Fail here rather than letting every k6 request run unauthenticated and
      # silently measuring 401 latency.
      - name: Verify the seeded k6 variables are exported
        run: |
          missing=0
          for name in TENANT_ID ACCESS_TOKEN CSRF_TOKEN; do
            if [ -z "$(printenv "$name")" ]; then
              echo "::error::$name was not exported by the seed step"
              missing=1
            fi
          done
          exit "$missing"

      # load-test/results is gitignored, so it does not exist in a fresh checkout. k6 only logs an
      # error when --summary-export cannot create the file, but the run then loses its summary and
      # the artifact upload finds nothing, which hid why the nightly run failed.
      - name: Prepare the results directory
        run: mkdir -p load-test/results

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      # k6 runs on the runner itself (not in a container action) so localhost reaches the Compose
      # stack. The variables seed.mjs writes to $GITHUB_ENV are exported into each step's process
      # environment, which k6 reads through __ENV; they are deliberately not repeated in a step
      # `env:` block, because `${{ env.X }}` only resolves values declared in the workflow and
      # would pass empty credentials. k6 exits 99 when a threshold is crossed, and the
      # `http_req_failed{scenario:multi_tenant_ramp}` budget is exactly what empty credentials
      # broke: every request returned 401 and counted as failed.
      - name: Smoke run (PRs only, low VUs)
        if: github.event_name == 'pull_request'
        run: >-
          k6 run load-test/k6/awap-load-test.js
          --summary-export=load-test/results/smoke-summary.json
        env:
          API_BASE: http://localhost:8080
          WEBHOOK_TARGET: http://localhost:9099/webhook
          K6_SMOKE: "1"

      - name: Full run (nightly and manual)
        if: github.event_name != 'pull_request'
        run: >-
          k6 run load-test/k6/awap-load-test.js
          --summary-export=load-test/results/full-summary.json
        env:
          API_BASE: http://localhost:8080
          WEBHOOK_TARGET: http://localhost:9099/webhook

      # The SQL file asserts the plan and raises on a regression, so ON_ERROR_STOP makes psql fail
      # the step instead of printing a scan plan that any "Scan" grep would accept.
      - name: Verify outbox partition pruning (EXPLAIN)
        if: github.event_name != 'pull_request'
        run: |
          docker compose -f infra/docker-compose.yml exec -T postgres \
            psql -v ON_ERROR_STOP=1 -U awap -d awap -f /dev/stdin \
            < load-test/k6/explain-outbox-partition.sql

      - name: Upload k6 summary and webhook log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: load-test-results
          path: |
            load-test/results
            load-test/seed.json
            load-test/fake-webhook.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop the stack
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v
