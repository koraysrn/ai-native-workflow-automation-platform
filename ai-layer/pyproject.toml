[project]
name = "awap-ai-layer"
version = "0.1.0"
description = "AI Layer of the AI-Native Workflow Automation Platform"
requires-python = ">=3.15.0,<3.16"
dependencies = [
    "fastapi>=0.135",
    "uvicorn>=0.35",
    "numpy>=2.3",
    "orjson>=3.11",
    "langchain==1.4.5",
    "langgraph==1.2.15",
]

[dependency-groups]
dev = [
    "ruff>=0.14",
]

[tool.uv]
# Force a certifi release that fixes GHSA-6q48-6c7w-9gw2 (bundled compromised root CAs).
override-dependencies = ["certifi>=2026.10.19"]

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
